# CP/M-86 drives: <letter>=<image>,<RO|RW>,<size identifier>
#   letter  A..F  (A: is the built-in LittleFS system image; B: to F: are SD images)
#   mode    RO or RW
#   size    CPM86_160K (163840 bytes), CPM86_516K (528384 bytes) or
#           CPM86_8196K (8392704 bytes); the identifier must match the image file
#   image   A: is /littlefs/cpm86/system.dsk, B: to F: below /retro/images/cpm86/
#
# Make the data images with tools/diskImage.py or tools/buildDiskImage.py
# (--os cpm86 --profile <size identifier>).
A=/littlefs/cpm86/system.dsk,RO,CPM86_516K
B=/retro/images/cpm86/language.dsk,RW,CPM86_8196K
C=/retro/images/cpm86/work86-1.dsk,RW,CPM86_516K
D=/retro/images/cpm86/work86-2.dsk,RW,CPM86_8196K
