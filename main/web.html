<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro SD Disk Image Manager</title>
<style>
:root
{
  color-scheme: dark;
  font: 16px system-ui, sans-serif;
  color: #edf3f7;
  background: #15212b;
}
*
{
  box-sizing: border-box;
}
body
{
  max-width: 1050px;
  margin: 0 auto;
  padding: 1rem;
}
header
{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  border-bottom: 1px solid #53616d;
  margin-bottom: 1.25rem;
}
button, input, select
{
  padding: .65rem;
  margin: .25rem 0;
  font: inherit;
}
button
{
  cursor: pointer;
}
button:disabled
{
  cursor: not-allowed;
  opacity: .6;
}
button, select, input
{
  max-width: 100%;
}
.toolbar, .row, .actions
{
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .6rem;
}
.toolbar
{
  margin-bottom: 1rem;
}
.row
{
  align-items: end;
}
.field
{
  display: grid;
  gap: .25rem;
  flex: 1 1 14rem;
}
.field input, .field select
{
  width: 100%;
}
.card-grid
{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: .8rem;
}
.card
{
  border: 1px solid #53616d;
  border-radius: .5rem;
  padding: 1rem;
  background: #1d2c38;
}
.card h3
{
  margin: 0 0 .45rem;
}
.muted
{
  color: #bac8d2;
}
.notice
{
  border-left: 4px solid #e3b354;
  padding: .6rem .8rem;
  background: #26313a;
}
a
{
  color: #90ddcf;
}
table
{
  width: 100%;
  border-collapse: collapse;
}
td, th
{
  padding: .65rem;
  border-bottom: 1px solid #53616d;
  text-align: left;
  overflow-wrap: anywhere;
}
#status
{
  min-height: 2rem;
  white-space: pre-wrap;
}
progress
{
  width: min(100%, 32rem);
  height: 1.25rem;
}
dialog
{
  max-width: min(42rem, calc(100vw - 2rem));
  color: #edf3f7;
  background: #1d2c38;
  border: 1px solid #90ddcf;
  border-radius: .5rem;
}
dialog::backdrop
{
  background: #000b;
}
.dialog-actions
{
  display: flex;
  justify-content: end;
  gap: .5rem;
}
#selectDialogList
{
  display: grid;
  gap: .25rem;
  min-width: min(30rem, 80vw);
  max-height: 60vh;
  overflow-y: auto;
}
#selectDialogList button
{
  margin: 0;
  text-align: left;
  overflow-wrap: anywhere;
}
#selectDialogList button[aria-selected="true"]
{
  border-color: #90ddcf;
  font-weight: bold;
}
details.fileList
{
  margin: .5rem 0;
}
details.fileList .fileListScroll
{
  max-height: 40vh;
  overflow: auto;
}
details.fileList .fileListScroll thead th
{
  position: sticky;
  top: 0;
  background: #1d2c38;
}
details.fileList summary
{
  cursor: pointer;
  color: #90ddcf;
}
#guestFilesDialog
{
  width: min(48rem, calc(100vw - 2rem));
  max-width: min(48rem, calc(100vw - 2rem));
}
#guestFilesScroll
{
  max-height: 55vh;
  overflow: auto;
  margin: .5rem 0;
}
#guestFilesScroll thead th
{
  position: sticky;
  top: 0;
  background: #1d2c38;
}
#guestFilesBody tr
{
  cursor: pointer;
}
@media (max-width: 600px)
{
  body
  {
    padding: .7rem;
  }
  header
  {
    align-items: flex-start;
  }
  table
  {
    font-size: .9rem;
  }
  td, th
  {
    padding: .4rem;
  }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Retro SD Disk Image Manager</h1>
  </div>
  <button id="helpButton" type="button" aria-haspopup="dialog">[Help]</button>
</header>
<nav id="navigation" class="toolbar" aria-label="Application navigation"></nav>
<main id="app" aria-live="polite"></main>
<progress id="progress" max="100" value="0" hidden></progress>
<p id="progressText" aria-live="polite"></p>
<p id="status" role="status" aria-live="polite"></p>
<dialog id="helpDialog">
  <h2 id="helpTitle">Help</h2>
  <div id="helpBody"></div>
  <form method="dialog" class="dialog-actions"><button>Close</button></form>
</dialog>
<dialog id="selectDialog">
  <h2 id="selectDialogTitle">Select</h2>
  <div id="selectDialogList" role="listbox"></div>
  <form method="dialog" class="dialog-actions"><button>Cancel</button></form>
</dialog>
<dialog id="guestFilesDialog">
  <h2 id="guestFilesTitle">Select files</h2>
  <div class="actions">
    <button id="guestFilesSelectAll" type="button">[Select All]</button>
    <span id="guestFilesCount" class="muted"></span>
  </div>
  <div id="guestFilesScroll">
    <table>
      <thead><tr><th>Select</th><th>Name</th><th>Type</th><th>User</th><th>Bytes</th><th>Flags</th></tr></thead>
      <tbody id="guestFilesBody"></tbody>
    </table>
  </div>
  <form method="dialog" class="dialog-actions"><button>Done</button></form>
</dialog>
<input id="computerFolderInput" type="file" webkitdirectory multiple accept=".dsk,.img,.po,.woz,.2mg" hidden>
<script>
"use strict";
const machines =
[
  ["cpm80", "CP/M-80"],
  ["cpm86", "CP/M-86"],
  ["ucsd", "UCSD Pascal"],
  ["apple2", "Apple II"],
  ["swtpc", "SWTPC 6800"]
];
const functions =
[
  {id: "computer-image-upload", number: "1", title: "Copy disk images from Computer to SD", available: true},
  {id: "computer-guest-upload", number: "2", title: "Copy single files from Computer to an SD disk image", available: true},
  {id: "image-computer-download", number: "3", title: "Copy disk images from SD to Computer", available: true},
  {id: "guest-computer-download", number: "4", title: "Copy single files from an SD disk image to Computer", available: true},
  {id: "guest-image-copy", number: "5", title: "Copy single files from disk image to disk image", available: true},
  {id: "image-image-copy", number: "6", title: "Copy whole disk images from SD to SD", available: true},
  {id: "manage-images", number: "7", title: "Browse and manage SD image files", available: true},
  {id: "sd-files-copy", number: "8", title: "Copy ordinary files between SD directories", available: false, reason: "ordinary SD-file copy is not implemented"},
  {id: "file-guest-copy", number: "9", title: "Copy ordinary SD files to or from guest images", available: true},
  {id: "computer-sd-files", number: "10", title: "Copy ordinary files between Computer and SD", available: false, reason: "ordinary SD-file transfer is not implemented"},
  {id: "guest-file-manage", number: "11", title: "Rename or delete guest files", available: true}
];
const state =
{
  screen: "home",
  functionId: null,
  machine: "cpm80",
  managerMachine: "cpm80"
};
const hostDirectories = new Map();
const hostFiles = new Map();
const hostDirectoryNames = new Map();
const app = document.getElementById("app");
const navigation = document.getElementById("navigation");
const helpDialog = document.getElementById("helpDialog");
const element = (id) => document.getElementById(id);
const directoryDatabaseName = "retroDiskImageManager";

function escapeHtml(value)
{
  return String(value).replace(/[&<>"']/g, (character) =>
  {
    const entities =
    {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#39;"
    };
    return entities[character];
  });
}

function machineOptions(selected)
{
  return machines.map(([id, label]) =>
    `<option value="${id}"${id === selected ? " selected" : ""}>${label}</option>`).join("");
}

function showStatus(message)
{
  element("status").textContent = message;
}

function showProgress(label, loaded, total)
{
  const progress = element("progress");
  progress.hidden = false;
  progress.value = total > 0 ? Math.min(100, loaded / total * 100) : 0;
  const percentage = total > 0 ? ` (${Math.floor(loaded / total * 100)}%)` : "";
  element("progressText").textContent = `${label}: ${loaded} / ${total} bytes${percentage}`;
}

function hideProgress()
{
  element("progress").hidden = true;
  element("progressText").textContent = "";
}

function validImageName(name)
{
  if (name.includes("/") || !/\.(dsk|img|po|woz|2mg)$/i.test(name))
  {
    showStatus("Use a plain image filename (.dsk, .img, .po, .woz, .2mg) without a directory.");
    return false;
  }
  return true;
}

function imagePath(machine, file)
{
  return [machine, file].filter(Boolean).join("/");
}

function apiPath(area, path)
{
  return `?area=${area}&path=${encodeURIComponent(path)}`;
}

function imageOperationQuery(source, destination)
{
  return `?source=${encodeURIComponent(source)}&destination=${encodeURIComponent(destination)}`;
}

async function api(path, options = {})
{
  const response = await fetch(path,
  {
    ...options,
    headers: options.headers || {}
  });
  if (!response.ok)
  {
    throw new Error(await response.text());
  }
  return response;
}

function hostDirectoryKey(direction, machine)
{
  return `${direction}:${machine}`;
}

function supportsHostDirectoryAccess()
{
  return window.isSecureContext && typeof window.showDirectoryPicker === "function";
}

function openHostDirectoryDatabase()
{
  return new Promise((resolve, reject) =>
  {
    if (!window.indexedDB)
    {
      reject(new Error("This browser does not provide IndexedDB for remembering Computer folders."));
      return;
    }
    const request = window.indexedDB.open(directoryDatabaseName, 1);
    request.onupgradeneeded = () =>
    {
      request.result.createObjectStore("directories");
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("Could not open browser folder storage."));
    request.onblocked = () => reject(new Error("Browser folder storage is blocked by another open manager page."));
  });
}

async function saveHostDirectory(direction, machine, handle)
{
  const database = await openHostDirectoryDatabase();
  return new Promise((resolve, reject) =>
  {
    const transaction = database.transaction("directories", "readwrite");
    try
    {
      transaction.objectStore("directories").put(handle, hostDirectoryKey(direction, machine));
    }
    catch (error)
    {
      database.close();
      reject(error);
      return;
    }
    transaction.oncomplete = () =>
    {
      database.close();
      resolve();
    };
    transaction.onerror = () =>
    {
      database.close();
      reject(transaction.error || new Error("Could not remember the Computer folder in this browser."));
    };
    transaction.onabort = () =>
    {
      database.close();
      reject(transaction.error || new Error("Could not remember the Computer folder in this browser."));
    };
  });
}

async function loadHostDirectory(direction, machine)
{
  const database = await openHostDirectoryDatabase();
  return new Promise((resolve, reject) =>
  {
    const transaction = database.transaction("directories", "readonly");
    const request = transaction.objectStore("directories").get(hostDirectoryKey(direction, machine));
    request.onsuccess = () =>
    {
      database.close();
      resolve(request.result || null);
    };
    request.onerror = () =>
    {
      database.close();
      reject(request.error || new Error("Could not read the remembered Computer folder."));
    };
  });
}

function hostFolderLabelId()
{
  return "computerUploadFolder";
}

function updateHostFolderLabel(machine, message)
{
  const label = element(hostFolderLabelId());
  if (!label)
  {
    return;
  }
  label.textContent = message || hostDirectoryNames.get(hostDirectoryKey("upload", machine)) ||
    "No Computer directory selected.";
}

function supportedImageFiles(files)
{
  return files.filter((file) => /\.(dsk|img|po|woz|2mg)$/i.test(file.name));
}

async function getFilesInHostDirectory(handle)
{
  const files = [];
  for await (const [name, entry] of handle.entries())
  {
    if (entry.kind === "file" && /\.(dsk|img|po|woz|2mg)$/i.test(name))
    {
      files.push(await entry.getFile());
    }
  }
  return files;
}

async function selectHostDirectory()
{
  const machine = element("uploadMachine").value;
  if (!supportsHostDirectoryAccess())
  {
    element("computerFolderInput").value = "";
    element("computerFolderInput").click();
    return;
  }

  let handle;
  try
  {
    handle = await window.showDirectoryPicker({mode: "read"});
  }
  catch (error)
  {
    if (error.name === "AbortError")
    {
      return;
    }
    throw error;
  }
  const key = hostDirectoryKey("upload", machine);
  hostDirectories.set(key, handle);
  hostDirectoryNames.set(key, handle.name);
  try
  {
    await saveHostDirectory("upload", machine, handle);
  }
  catch (error)
  {
    showStatus(`Selected ${handle.name}, but this browser could not remember it: ${error.message}`);
  }

  const files = supportedImageFiles(await getFilesInHostDirectory(handle));
  hostFiles.set(machine, files);
  updateHostFolderLabel(machine,
    `${handle.name}: ${files.length} supported disk image(s) selected.`);
  if (files.length === 0)
  {
    showStatus(`No supported disk images were found directly inside ${handle.name}.`);
  }
}

async function reuseHostDirectory()
{
  const machine = element("uploadMachine").value;
  const key = hostDirectoryKey("upload", machine);
  const handle = hostDirectories.get(key) || await loadHostDirectory("upload", machine);
  if (!handle)
  {
    showStatus(`No remembered Computer folder exists for ${machine}. Choose a Computer folder first.`);
    return;
  }

  let permission = await handle.queryPermission({mode: "read"});
  if (permission !== "granted")
  {
    permission = await handle.requestPermission({mode: "read"});
  }
  if (permission !== "granted")
  {
    showStatus(`Permission to use ${handle.name} was not granted. Choose the Computer folder again.`);
    return;
  }

  hostDirectories.set(key, handle);
  hostDirectoryNames.set(key, handle.name);
  const files = supportedImageFiles(await getFilesInHostDirectory(handle));
  hostFiles.set(machine, files);
  updateHostFolderLabel(machine,
    `${handle.name}: ${files.length} supported disk image(s) selected.`);
  if (files.length === 0)
  {
    showStatus(`No supported disk images were found directly inside ${handle.name}.`);
  }
}

function helpContent()
{
  if (state.screen === "home")
  {
    return ["Functions / Selection",
      "<p>Choose a transfer direction. Whole-image functions operate on SD image files; guest-file functions operate on single files inside CP/M-80, CP/M-86, Apple II (ProDOS and DOS 3.3) and UCSD Pascal images (SWTPC 6800 is not yet supported).</p>" +
      "<p>Computer access uses browser-authorized file selection and standard browser downloads. The browser/OS controls download destination and may show its save picker according to browser settings.</p>" +
      "<p>Every SD image is managed regardless of whether its emulator drive is marked RO or RW in drives.cfg. Destructive actions warn about existing drive mappings; configuration files themselves remain protected.</p>"];
  }
  const selected = functions.find((item) => item.id === state.functionId);
  const title = selected ? selected.title : "SD image manager";
  const details =
  {
    "computer-image-upload": "<p>Select the destination OS (images are always written to /retro/images/&lt;OS&gt;/ on the SD card), then choose a Computer folder or individual image files. Supported secure browsers can remember an authorized source folder per selected machine in browser IndexedDB; permission can expire. On ordinary HTTP from the ESP32, use the native directory picker fallback. The browser controls its starting location. LittleFS is on the ESP32 and cannot store a Computer path. Only supported disk images directly inside the selected folder are uploaded. Choose “drives.cfg” in Copy From to copy a single drive-configuration file instead: it is stored as /retro/images/&lt;OS&gt;/drives.cfg, replacing the existing one after confirmation. Existing SD destinations are skipped unless OVERWRITE is checked and confirmed. FAT32 limits one file to less than 4 GiB.</p>",
    "image-computer-download": "<p>Select the source OS and choose a whole image to download. On browsers with the secure File System Access save picker, the destination is selected when you start the download. Otherwise the browser uses its normal download behavior; enable “Ask where to save each file” in browser settings if you want a destination picker. No separate Computer destination directory is needed. This downloads the complete image container byte-for-byte, not guest files inside it. The first list entry, drives.cfg, always appears and downloads the drive configuration of the selected OS (an error is shown if it does not exist on the SD card).</p>",
    "image-image-copy": "<p>Select the source OS and image, then a destination OS and new image filename. The firmware copies in bounded chunks and verifies bytes before commit. Source remains unchanged. OVERWRITE requires confirmation and preserves the prior destination during commit. A mapped RO image is still eligible; its drives.cfg reference is not rewritten.</p>",
    "computer-guest-upload": "<p>Choose the destination OS, disk image and user area, then select Computer files. The preview shows the uppercase name each file will get under the rules of the destination file system (8.3 for CP/M), flags invalid or duplicate names and shows which names already exist. Existing files are skipped unless OVERWRITE is checked and confirmed. Empty files cannot be stored. Data is written to free blocks first and the directory is updated last through an undo journal, so a power loss leaves either the old or the new state. Overwriting needs free room for both copies. The emulators and this manager are mutually exclusive.</p>",
    "guest-computer-download": "<p>Choose an OS, image and user area filter, tick one or more files and download them. One file uses the browser's save picker when available; several files use the normal browser download behavior. Damaged files (broken extent chains) are shown but cannot be downloaded.</p>",
    "guest-image-copy": "<p>Pick the source image and tick files, then pick a destination image and user area. The source may be the same image (copy to another user area). The source is never changed. Existing destination files are skipped unless OVERWRITE is checked and confirmed. Copies stream in small chunks and cross-OS copies are allowed (for example CP/M-80 to CP/M-86, or ProDOS to UCSD Pascal, where file type and Pascal kind are mapped; DOS 3.3 headers are stripped on read and rebuilt on write). ProDOS subdirectories are listed but cannot be opened, and the user area is hidden for file systems without user areas.</p>",
    "file-guest-copy": "<p>Top: copy an ordinary SD file (not a disk image) from /retro/images/&lt;OS&gt;/ into a guest image; the guest name is converted to the name rule of the destination file system (8.3 for CP/M). Bottom: copy ticked guest files out to /retro/images/&lt;OS&gt;/ as ordinary SD files. The SD file is written to a temporary file and committed atomically; an existing SD file is replaced only after confirmation. SD names cannot contain characters such as $ that FAT file names handled by this manager reject.</p>",
    "guest-file-manage": "<p>Tick files to delete them (confirmation required) or tick exactly one file to rename it. Delete only frees the directory entries; renaming refuses an existing name and keeps the user area. Both are journaled, so an interrupted operation is rolled back the next time the manager touches that OS directory.</p>",
    "manage-images": "<p>Select an OS to list its image files in /retro/images/&lt;OS&gt;/ (there are no sub-directories). Download files, copy or rename whole disk images, and delete regular files. Image operations are allowed regardless of drives.cfg RO/RW mapping. Deleting or renaming a mapped image can break a drive reference; review the warning and confirm deliberately. drives.cfg can be replaced only through function 1 (Copy From = drives.cfg); neither it nor config.cfg can be deleted here, and config.cfg cannot be replaced.</p>",
  };
  const extra = details[state.functionId] ||
    "<p>This function is part of the planned manager, but guest filesystem support is not implemented yet. No guest-file operation is performed.</p>";
  return [title, extra];
}

function showHelp()
{
  const [title, body] = helpContent();
  element("helpTitle").textContent = title;
  element("helpBody").innerHTML = body;
  helpDialog.showModal();
}

function navigate(screen, functionId = state.functionId, addHistory = true)
{
  state.screen = screen;
  state.functionId = functionId;
  if (addHistory)
  {
    history.pushState({screen, functionId}, "", `#${screen}${functionId ? `/${functionId}` : ""}`);
  }
  render();
}

function renderHome()
{
  return `<h2>Functions / Selection</h2>
    <p class="notice">Whole-image operations are available. Guest files can be listed, copied, renamed and deleted inside CP/M-80, CP/M-86, ProDOS, DOS 3.3 and UCSD Pascal images (140K, 640K and 800K Apple images, either sector order); SWTPC 6800 follows in a later release.</p>
    <div class="card-grid">${functions.map((item) =>
    {
      const status = item.available ? "Available" : `Not implemented — ${item.reason}`;
      return `<section class="card">
        <h3>${item.number}. ${escapeHtml(item.title)}</h3>
        <p class="muted">${escapeHtml(status)}</p>
        ${item.available ? `<button type="button" data-open-function="${item.id}">Open</button>` : ""}
      </section>`;
    }).join("")}</div>`;
}

function renderImageUpload()
{
  const folderAccessNote = supportsHostDirectoryAccess() ?
    "Choose a Computer folder. The browser may remember its authorized handle per selected machine; permission can expire. A website cannot discover or force an absolute host path." :
    "This browser connection cannot retain Computer folder handles. Choose a folder with the native picker; the browser/OS controls its starting location. A website cannot discover or force an absolute host path.";
  return `<h2>${escapeHtml(functions[0].title)}</h2>
    <p>Choose a Computer folder or files with the browser's native picker, then upload complete disk images to /retro/images/&lt;OS&gt;/ on the SD card.</p>
    <div class="row">
      <label class="field">Destination OS directory
        <select id="uploadMachine">${machineOptions(state.machine)}</select>
      </label>
      <span class="muted">Target: /retro/images/<span id="uploadMachineLabel">${state.machine}</span>/</span>
    </div>
    <label class="field">Copy From — Computer item type
      <select id="uploadKind">
        <option value="images">Disk images (Computer folder or files)</option>
        <option value="drivesCfg">drives.cfg — drive configuration of the selected OS</option>
      </select>
    </label>
    <div id="uploadImageSection">
    <div class="card">
      <h3>Computer source directory</h3>
      <p id="computerUploadFolder" class="muted">No Computer directory selected.</p>
      <div class="actions">
        <button id="chooseUploadFolder" type="button">Choose Computer folder</button>
        <button id="reuseUploadFolder" type="button"${supportsHostDirectoryAccess() ? "" : " disabled"}>Use last folder for this machine</button>
      </div>
      <p class="muted">${folderAccessNote} Suggested organization: ~/Downloads/images/&lt;machine&gt; on macOS/Linux or %USERPROFILE%\\Downloads\\images\\&lt;machine&gt; on Windows; create/select it yourself.</p>
    </div>
    <form id="imageUploadForm">
      <label class="field">Or select individual disk image file(s)
        <input id="imageFiles" type="file" multiple accept=".dsk,.img,.po,.woz,.2mg">
      </label>
      <label><input id="overwrite" type="checkbox"> OVERWRITE existing image(s)</label>
      <button id="uploadButton" type="submit">Copy disk image(s) to SD</button>
    </form>
    <p class="muted">RO/RW drive mappings do not block manager access. Replacing a mapped image affects the image used on its next emulator mount.</p>
    </div>
    <div id="uploadConfigSection" hidden>
      <form id="configUploadForm" class="card">
        <h3>drives.cfg</h3>
        <label class="field">Select the drives.cfg file on the Computer (any file name; it is stored as drives.cfg)
          <input id="configFile" type="file" accept=".cfg,.txt,text/plain">
        </label>
        <button id="configUploadButton" type="submit">Copy drives.cfg to SD</button>
        <p class="muted">Target: /retro/images/<span id="configTargetLabel">${state.machine}</span>/drives.cfg. Only this one file is written; no disk image is touched. The file must be plain text (at most 16384 bytes, lines of at most 254 characters). The existing drives.cfg is replaced after confirmation; a failed upload leaves it unchanged. The emulator reads it at its next start. config.cfg stays protected.</p>
      </form>
    </div>`;
}

function renderImageDownload()
{
  return `<h2>${escapeHtml(functions[2].title)}</h2>
    <div class="row">
      <label class="field">Source OS directory
        <select id="downloadMachine">${machineOptions(state.machine)}</select>
      </label>
      <span class="muted">Source: /retro/images/<span id="downloadMachineLabel">${state.machine}</span>/</span>
      <button type="button" id="loadDownloadImages">List images</button>
    </div>
    <label class="field">Copy From — whole image container or drives.cfg
      <select id="downloadImage"><option value="">Select an image</option></select>
    </label>

async function loadImageOptions(prefix)
{
  try
  {
    const directory = element(prefix === "download" ? "downloadMachine" : "copySourceMachine").value;
    const entries = await listPath("images", directory);
    const select = element(prefix === "download" ? "downloadImage" : "copySourceImage");
    select.replaceChildren(new Option(prefix === "download" ? "Select an image" : "Select a source image", ""));
    if (prefix === "download")

      select.add(new Option(`drives.cfg — drive configuration (${configurationState})`,

    {

async function downloadToComputer(url, name)
{
  if (!window.isSecureContext || typeof window.showSaveFilePicker !== "function")
  {
    downloadUrl(url, name);
    showStatus(`Download requested for ${name}. If the browser does not prompt, enable its “Ask where to save each file” setting.`);
    return;
  }

  let fileHandle;
  try
  {
    fileHandle = await window.showSaveFilePicker({suggestedName: name});
  }
  catch (error)
  {
    if (error.name === "AbortError")
    {
      showStatus("Download cancelled.");
      return;
    }
    throw error;
  }

  const response = await fetch(url);
  if (!response.ok)
  {
    throw new Error(await response.text());
  }
  if (!response.body)
  {
    throw new Error("This browser cannot stream the image to the selected destination.");
  }

  const total = Number(response.headers.get("Content-Length")) || Number(response.headers.get("X-Guest-Size")) || 0;
  const writable = await fileHandle.createWritable();
  let reader;
  let loaded = 0;
  try
  {
    reader = response.body.getReader();
    while (true)
    {
      const {done, value} = await reader.read();
      if (done)
      {
        break;
      }
      await writable.write(value);
      loaded += value.byteLength;
      showProgress(`Downloading ${name}`, loaded, total);
    }
    await writable.close();
  }
  catch (error)
  {
    try
    {
      await writable.abort();
    }
    catch (abortError)
    {
      throw new Error(`${error.message} (Could not clean up the incomplete Computer file: ${abortError.message})`);
    }
    throw error;
  }
  finally
  {
    if (reader)
    {
      reader.releaseLock();
    }
    hideProgress();
  }
  showStatus(`Downloaded ${loaded} bytes to the selected Computer destination.`);
}

function transferUpload(area, path, file, overwrite, progressLabel)
{
  if (file.size > 4294967294)
  {
    return Promise.reject(new Error(`Maximum file size is 4 GiB minus 2 bytes: ${file.name}`));
  }
  const request = new XMLHttpRequest();
  request.open("PUT", `/api/file${apiPath(area, path)}`);
  request.setRequestHeader("Content-Type", "application/octet-stream");
  if (overwrite)
  {
    request.setRequestHeader("X-Overwrite", "1");
  }
  request.upload.onprogress = (event) =>
  {
    showProgress(progressLabel, event.loaded, event.lengthComputable ? event.total : file.size);
  };
  return new Promise((resolve, reject) =>
  {
    request.onload = () =>
    {
      if (request.status >= 200 && request.status < 300)
      {
        resolve(request.responseText);
      }
      else
      {
        reject(new Error(request.responseText || `Upload failed (${request.status}).`));
      }
    };
    request.onerror = () => reject(new Error("Connection lost. Check the USB terminal."));
    request.onabort = () => reject(new Error("Transfer cancelled."));
    request.send(file);
  });
}

async function refreshManager()
{
  state.managerMachine = element("managerMachine").value;
  const rows = await listPath("images", state.managerMachine);
  element("managerLocation").textContent = `/retro/images/${state.managerMachine}/`;
  const body = element("managerEntries");
  body.replaceChildren();
  rows.sort((first, second) => Number(second.directory) - Number(first.directory) || first.name.localeCompare(second.name));
  for (const entry of rows)
  {
    const row = document.createElement("tr");
    const name = document.createElement("td");
    const size = document.createElement("td");
    const actions = document.createElement("td");
    name.textContent = entry.name;
    size.textContent = `${entry.size} bytes${entry.mapped ? " — mapped; manager access allowed" : ""}`;
    if (!entry.directory)
    {
      const relative = imagePath(state.managerMachine, entry.name);
      const download = document.createElement("button");
      download.textContent = "Download";
      download.onclick = () => downloadFile("images", relative, entry.name);
      actions.append(download);
      if (/\.(dsk|img|po|woz|2mg)$/i.test(entry.name))
      {
        const copy = document.createElement("button");
        copy.textContent = "Copy image";
        copy.onclick = async () =>
        {
          const newName = prompt(`Copy complete image to a new filename in /retro/images/${state.managerMachine}/:`,
            `copy-${entry.name}`);
          if (!newName || !validImageName(newName))
          {
            return;
          }
          const destinationName = imagePath(state.managerMachine, newName);
          if (element("managerOverwrite").checked &&
              !confirm("Overwrite destination? It may be mapped in drives.cfg, including as RO. The mapping will not be changed; the previous image is preserved during commit."))
          {
            return;
          }
          const response = await api(`/api/images/copy${imageOperationQuery(relative, destinationName)}`,
            {method: "POST", headers: element("managerOverwrite").checked ? {"X-Overwrite": "1"} : {}});
          showStatus(await response.text());
          await refreshManager();
        };
        const rename = document.createElement("button");
        rename.textContent = "Rename / move";
        rename.onclick = async () =>
        {
          const newName = prompt(`New filename in /retro/images/${state.managerMachine}/:`, entry.name);
          if (!newName || newName === entry.name || !validImageName(newName))
          {
            return;
          }
          const destinationName = imagePath(state.managerMachine, newName);
          if (!confirm(`${entry.mapped ? "WARNING: this image is mapped in drives.cfg. " : ""}Move ${relative} to ${destinationName}? The mapping will not be changed.`))
          {
            return;
          }
          const response = await api(`/api/images/rename${imageOperationQuery(relative, destinationName)}`,
            {method: "POST"});
          showStatus(await response.text());
          await refreshManager();
        };
        actions.append(copy, rename);
      }
      const remove = document.createElement("button");
      remove.textContent = "Delete";
      remove.disabled = entry.name.toLowerCase() === "drives.cfg" || entry.name.toLowerCase() === "config.cfg";
      remove.onclick = async () =>
      {
        const warning = entry.mapped ?
          `WARNING: ${relative} is referenced by drives.cfg. Deleting it can break emulator startup or drive access. Delete anyway?` :
          `Delete ${relative}? This cannot be undone.`;
        if (!confirm(warning))
        {
          return;
        }
        const response = await api(`/api/file${apiPath("images", relative)}`, {method: "DELETE"});
        showStatus(await response.text());
        await refreshManager();
      };
      actions.append(remove);
    }
    row.append(name, size, actions);
    body.append(row);
  }
}

const guestMachineIds = ["cpm80", "cpm86", "apple2", "ucsd"];
const guestImagePattern = /\.(dsk|img|po|woz|2mg)$/i;
const guestSlots =
{
  guestA: {image: "", info: null, files: [], selected: new Set()},
  guestB: {image: "", info: null, files: [], selected: new Set()}
};

function guestQuery(parameters)
{
  return Object.entries(parameters).map(([key, value]) => `${key}=${encodeURIComponent(value)}`).join("&");
}

function guestNamePreview(fileName, rule)
{
  const upper = fileName.toUpperCase();
  if (rule === "prodos")
  {
    return /^[A-Z][A-Z0-9.]{0,14}$/.test(upper) ? upper : null;
  }
  if (rule === "pascal")
  {
    return upper.length >= 1 && upper.length <= 15 && /^[\x21-\x7e]+$/.test(upper) && !/[$=?,[#:\/]/.test(upper) ? upper : null;
  }
  if (rule === "dos33")
  {
    return upper.length >= 1 && upper.length <= 30 && /^[\x20-\x5f]+$/.test(upper) && !upper.includes(",") ? upper : null;
  }
  const dot = upper.indexOf(".");
  const base = dot < 0 ? upper : upper.slice(0, dot);
  const extension = dot < 0 ? "" : upper.slice(dot + 1);
  if (upper.length === 0 || upper.length > 12 || base.length < 1 || base.length > 8 || extension.length > 3 ||
      !/^[A-Z0-9_$-]*$/.test(base + extension))
  {
    return null;
  }
  return extension ? `${base}.${extension}` : base;
}

function guestRule(slot)
{
  return guestSlots[slot].info ? guestSlots[slot].info.nameRule : "cpm";
}

function guestRuleHelp(rule)
{
  return {
    prodos: "1-15 characters, a letter first, then letters, digits or dots",
    pascal: "1-15 printable characters without space or any of $ = ? , [ # : /",
    dos33: "1-30 characters from space to underscore, no comma"
  }[rule] || "1-8 characters, optional .1-3; letters, digits, _ $ -";
}

function formatBytes(bytes)
{
  return bytes >= 1048576 ? `${(bytes / 1048576).toFixed(1)} MiB` : bytes >= 1024 ? `${(bytes / 1024).toFixed(1)} KiB` : `${bytes} bytes`;
}

function guestUploadPlan()
{
  const input = element("guestUploadFiles");
  const files = input ? Array.from(input.files) : [];
  const existing = new Set(guestSlots.guestB.files.filter((entry) => entry.user === Number(element("guestBUser").value))
    .map((entry) => entry.name));
  const overwrite = element("guestUploadOverwrite").checked;
  const seen = new Set();
  return files.map((file) =>
  {
    const guestName = guestNamePreview(file.name, guestRule("guestB"));
    let result = "OK";
    let accepted = true;
    if (!guestName)
    {
      result = `Invalid name (${guestRuleHelp(guestRule("guestB"))})`;
      accepted = false;
    }
    else if (file.size === 0)
    {
      result = "Empty files cannot be stored";
      accepted = false;
    }
    else if (seen.has(guestName))
    {
      result = "Duplicate guest name in this selection";
      accepted = false;
    }
    else if (existing.has(guestName))
    {
      result = overwrite ? "Exists: will be OVERWRITTEN" : "Exists: will be skipped";
      accepted = overwrite;
    }
    if (guestName)
    {
      seen.add(guestName);
    }
    return {file, guestName, result, accepted};
  });
}

function refreshGuestUploadPreview()
{
  const body = element("guestUploadPreview");
  if (!body)
  {
    return;
  }
  body.replaceChildren();
  const plan = guestUploadPlan();
  for (const item of plan)
  {
    const row = document.createElement("tr");
    for (const text of [item.file.name, item.guestName || "-", String(item.file.size), item.result])
    {
      const cell = document.createElement("td");
      cell.textContent = text;
      row.append(cell);
    }
    body.append(row);
  }
  const total = plan.filter((item) => item.accepted).reduce((sum, item) => sum + item.file.size, 0);
  const free = guestSlots.guestB.info ? guestSlots.guestB.info.freeBytes : null;
  element("guestUploadTotals").textContent = `To store: ${formatBytes(total)}` +
    (free === null ? "" : `; free in image: ${formatBytes(free)}${total > free ? " — NOT ENOUGH SPACE" : ""}`);
}

async function submitGuestUpload()
{
  const image = element("guestBImage").value;
  if (!image)
  {
    throw new Error("Select a destination disk image first.");
  }
  const user = element("guestBUser").value;
  const overwrite = element("guestUploadOverwrite").checked;
  const typeText = element("guestUploadType").value.trim();
  const auxText = element("guestUploadAux").value.trim();
  if (!/^([0-9a-f]{1,2})?$/i.test(typeText) || !/^([0-9a-f]{1,4})?$/i.test(auxText))
  {
    throw new Error("The Apple file type must be 1-2 hex digits and the aux type 1-4 hex digits.");
  }
  const plan = guestUploadPlan();
  if (plan.length === 0)
  {
    throw new Error("Choose one or more Computer files first.");
  }
  const todo = plan.filter((item) => item.accepted);
  if (todo.length === 0)
  {
    throw new Error("Nothing can be stored: " + plan.map((item) => `${item.file.name}: ${item.result}`).join("; "));
  }
  const replaced = todo.filter((item) => item.result.startsWith("Exists"));
  if (replaced.length > 0 &&
      !confirm(`OVERWRITE ${replaced.map((item) => item.guestName).join(", ")} in ${image} (user ${user})? Overwriting needs free room for both copies while it runs.`))
  {
    return;
  }
  element("guestUploadButton").disabled = true;
  const lines = plan.filter((item) => !item.accepted).map((item) => `${item.file.name}: skipped (${item.result})`);
  try
  {
    for (const item of todo)
    {
      const parameters = {image, user, name: item.guestName, overwrite: overwrite ? "1" : "0"};
      if (typeText)
      {
        parameters.ptype = typeText;
      }
      if (auxText)
      {
        parameters.aux = auxText;
      }
      const url = `/api/guest/upload?${guestQuery(parameters)}`;
      try
      {
        await transferGuestUpload(url, item.file, `Storing ${item.guestName}`);
        lines.push(`${item.file.name} -> ${item.guestName}: stored`);
      }
      catch (error)
      {
        lines.push(`${item.file.name}: FAILED - ${error.message}`);
      }
      showStatus(lines.join("\n"));
    }
  }
  finally
  {
    element("guestUploadButton").disabled = false;
    hideProgress();
  }
  showStatus(lines.join("\n"));
  await loadGuestListing("guestB");
}

async function downloadGuestFiles()
{
  const image = element("guestAImage").value;
  const selected = guestSelectedFiles("guestA");
  if (!image || selected.length === 0)
  {
    throw new Error("Select an image and at least one file.");
  }
  if (selected.length === 1)
  {
    await downloadToComputer(guestFileDownloadUrl(image, selected[0]), selected[0].name);
    return;
  }
  const lines = [];
  for (const entry of selected)
  {
    try
    {
      const response = await api(guestFileDownloadUrl(image, entry));
      const link = document.createElement("a");
      link.href = URL.createObjectURL(await response.blob());
      link.download = entry.name;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
      lines.push(`${entry.name}: downloaded`);
    }
    catch (error)
    {
      lines.push(`${entry.name}: FAILED - ${error.message}`);
    }
    showStatus(lines.join("\n"));
  }
}

async function copyGuestFiles()
{
  const source = element("guestAImage").value;
  const destination = element("guestBImage").value;
  const destinationUser = Number(element("guestBUser").value);
  const selected = guestSelectedFiles("guestA");
  if (!source || !destination || selected.length === 0)
  {
    throw new Error("Select a source image, a destination image and at least one source file.");
  }
  const overwrite = element("guestCopyOverwrite").checked;
  const existing = new Set(guestSlots.guestB.files.filter((entry) => entry.user === destinationUser).map((entry) => entry.name));
  const todo = [];
  const lines = [];
  for (const entry of selected)
  {
    if (source.toLowerCase() === destination.toLowerCase() && entry.user === destinationUser)
    {
      lines.push(`${entry.name}: skipped (source and destination are the same file)`);
    }
    else if (existing.has(entry.name) && !overwrite)
    {
      lines.push(`${entry.name}: skipped (exists; enable OVERWRITE)`);
    }
    else
    {
      todo.push(entry);
    }
  }
  const replaced = todo.filter((entry) => existing.has(entry.name));
  if (todo.length === 0)
  {
    showStatus(lines.join("\n"));
    return;
  }
  if (replaced.length > 0 &&
      !confirm(`OVERWRITE ${replaced.map((entry) => entry.name).join(", ")} in ${destination} (user ${destinationUser})?`))
  {
    return;
  }
  for (const entry of todo)
  {
    try
    {
      const query = guestQuery({fromImage: source, fromUser: entry.user, fromName: entry.name, toImage: destination,
        toUser: destinationUser, overwrite: overwrite ? "1" : "0"});
      await api(`/api/guest/copy?${query}`, {method: "POST"});
      lines.push(`${entry.name}: copied`);
    }
    catch (error)
    {
      lines.push(`${entry.name}: FAILED - ${error.message}`);
    }
    showStatus(lines.join("\n"));
  }
  await loadGuestListing("guestB");
  if (source.toLowerCase() === destination.toLowerCase())
  {
    await loadGuestListing("guestA");
  }
}

async function loadSdFiles()
{
  const machine = element("sdSourceMachine").value;
  const select = element("sdSourceFile");
  select.replaceChildren(new Option("Select a file", ""));
  try
  {
    const entries = await listPath("images", machine);
    for (const entry of entries.filter((item) => !item.directory && !guestImagePattern.test(item.name) &&
      !/^(drives|config)\.cfg$/i.test(item.name) && !/\.tmp$/i.test(item.name)))
    {
      select.add(new Option(`${entry.name} (${entry.size} bytes)`, imagePath(machine, entry.name)));
    }
  }
  catch (error)
  {
    showStatus(error.message);
  }
}

async function copySdFileToGuest()
{
  const file = element("sdSourceFile").value;
  const image = element("guestBImage").value;
  if (!file || !image)
  {
    throw new Error("Select an SD file and a destination image.");
  }
  const user = Number(element("guestBUser").value);
  const typed = element("sdToGuestName").value.trim();
  const guestName = guestNamePreview(typed || file.split("/").pop(), guestRule("guestB"));
  if (!guestName)
  {
    throw new Error(`The guest file name is not valid (${guestRuleHelp(guestRule("guestB"))}).`);
  }
  const overwrite = element("fileGuestOverwrite").checked;
  const exists = guestSlots.guestB.files.some((entry) => entry.user === user && entry.name === guestName);
  if (exists && !overwrite)
  {
    throw new Error(`${guestName} already exists in user ${user}; enable OVERWRITE to replace it.`);
  }
  if (exists && !confirm(`OVERWRITE ${guestName} in ${image} (user ${user})?`))
  {
    return;
  }
  const query = guestQuery({fromFile: file, toImage: image, toUser: user, toName: guestName, overwrite: overwrite ? "1" : "0"});
  const response = await api(`/api/guest/copy?${query}`, {method: "POST"});
  showStatus(`${file} -> ${image}: ${await response.text()}`);
  await loadGuestListing("guestB");
}

async function copyGuestFilesToSd()
{
  const image = element("guestAImage").value;
  const selected = guestSelectedFiles("guestA");
  if (!image || selected.length === 0)
  {
    throw new Error("Select a guest image and at least one file.");
  }
  const machine = element("sdTargetMachine").value;
  const typed = element("guestToSdName").value.trim();
  if (typed && selected.length !== 1)
  {
    throw new Error("A single SD file name can only be used when exactly one guest file is selected.");
  }
  const existing = new Set((await listPath("images", machine)).filter((item) => !item.directory).map((item) => item.name.toLowerCase()));
  const targets = selected.map((entry) => ({entry, name: typed || entry.name}));
  const collisions = targets.filter((target) => existing.has(target.name.toLowerCase()));
  if (collisions.length > 0 &&
      !confirm(`OVERWRITE ${collisions.map((target) => target.name).join(", ")} in /retro/images/${machine}/ on the SD card?`))
  {
    return;
  }
  const lines = [];
  for (const target of targets)
  {
    try
    {
      const query = guestQuery({fromImage: image, fromUser: target.entry.user, fromName: target.entry.name,
        toFile: imagePath(machine, target.name), overwrite: "1"});
      await api(`/api/guest/copy?${query}`, {method: "POST"});
      lines.push(`${target.entry.name} -> ${imagePath(machine, target.name)}: copied`);
    }
    catch (error)
    {
      lines.push(`${target.entry.name}: FAILED - ${error.message}`);
    }
    showStatus(lines.join("\n"));
  }
  await loadSdFiles();
}

async function renameGuestFile()
{
  const image = element("guestAImage").value;
  const selected = guestSelectedFiles("guestA");
  if (!image || selected.length !== 1)
  {
    throw new Error("Select exactly one file to rename.");
  }
  const entry = selected[0];
  const newName = prompt(`New name for ${entry.name} (user ${entry.user}):`, entry.name);
  if (!newName)
  {
    return;
  }
  const guestName = guestNamePreview(newName.trim(), guestRule("guestA"));
  if (!guestName)
  {
    throw new Error(`The new name is not valid (${guestRuleHelp(guestRule("guestA"))}).`);
  }
  if (guestName === entry.name)
  {
    return;
  }
  if (!confirm(`Rename ${entry.name} to ${guestName} in ${image} (user ${entry.user})?`))
  {
    return;
  }
  const response = await api(`/api/guest/rename?${guestQuery({image, user: entry.user, name: entry.name, to: guestName})}`,
    {method: "POST"});
  showStatus(await response.text());
  await loadGuestListing("guestA");
}

async function deleteGuestFiles()
{
  const image = element("guestAImage").value;
  const selected = guestSelectedFiles("guestA");
  if (!image || selected.length === 0)
  {
    throw new Error("Select at least one file to delete.");
  }
  if (!confirm(`DELETE ${selected.map((entry) => `${entry.name} (user ${entry.user})`).join(", ")} from ${image}? This cannot be undone.`))
  {
    return;
  }
  const lines = [];
  for (const entry of selected)
  {
    try
    {
      await api(`/api/guest/delete?${guestQuery({image, user: entry.user, name: entry.name})}`, {method: "POST"});
      lines.push(`${entry.name}: deleted`);
    }
    catch (error)
    {
      lines.push(`${entry.name}: FAILED - ${error.message}`);
    }
  }
  showStatus(lines.join("\n"));
  await loadGuestListing("guestA");
}

async function run(action)
{
  try

    await action();

  catch (error)
  {
    showStatus(error.message || "Operation failed. Check the connection and SD card.");
  }
}

const selectDialog = element("selectDialog");
const selectDialogList = element("selectDialogList");
let selectDialogTarget = null;

function openSelectPopup(select)
{
  if (select.disabled || select.options.length === 0)
  {
    return;
  }
  const label = select.closest("label");
  const title = label ? Array.from(label.childNodes).filter((node) => node.nodeType === Node.TEXT_NODE)
    .map((node) => node.textContent.trim()).join(" ").trim() : "";
  element("selectDialogTitle").textContent = title || "Select";
  selectDialogList.replaceChildren();
  Array.from(select.options).forEach((option, index) =>
  {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = option.textContent;
    button.disabled = option.disabled;
    button.dataset.optionIndex = String(index);
    button.setAttribute("role", "option");
    button.setAttribute("aria-selected", index === select.selectedIndex ? "true" : "false");
    selectDialogList.append(button);
  });
  selectDialogTarget = select;
  selectDialog.showModal();
  const current = selectDialogList.querySelector('[aria-selected="true"]');
  if (current)
  {
    current.scrollIntoView({block: "center"});
  }
}

selectDialogList.addEventListener("click", (event) =>
{
  const button = event.target.closest("button[data-option-index]");
  if (!button || !selectDialogTarget)
  {
    return;
  }
  const select = selectDialogTarget;
  const index = Number(button.dataset.optionIndex);
  selectDialogTarget = null;
  selectDialog.close();
  if (select.selectedIndex !== index)
  {
    select.selectedIndex = index;
    select.dispatchEvent(new Event("change", {bubbles: true}));
  }
  select.focus();
});
selectDialog.addEventListener("click", (event) =>
{
  if (event.target === selectDialog)
  {
    selectDialog.close();
  }
});
selectDialog.addEventListener("close", () =>
{
  selectDialogTarget = null;
});
const guestFilesDialog = element("guestFilesDialog");
const guestFilesBody = element("guestFilesBody");
let guestFilesSlot = null;

function renderGuestFilesPopup()
{
  const slot = guestFilesSlot;
  const files = guestSlots[slot].files;
  const indexes = guestVisibleIndexes(slot);
  guestFilesBody.replaceChildren();
  for (const index of indexes)
  {
    const entry = files[index];
    const row = document.createElement("tr");
    const boxCell = document.createElement("td");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.dataset.guestIndex = String(index);
    box.disabled = !guestEntryIsSelectable(entry);
    box.checked = !box.disabled && guestSlots[slot].selected.has(index);
    boxCell.append(box);
    row.append(boxCell);
    for (const text of [entry.name, entry.type || "", String(entry.user), String(entry.size), guestFlagsText(entry)])
    {
      const cell = document.createElement("td");
      cell.textContent = text;
      row.append(cell);
    }
    guestFilesBody.append(row);
  }
  if (indexes.length === 0)
  {
    const row = document.createElement("tr");
    const cell = document.createElement("td");
    cell.colSpan = 6;
    cell.textContent = guestSlots[slot].image ? "No files in this user area." : "Select an image first.";
    row.append(cell);
    guestFilesBody.append(row);
  }
  element("guestFilesCount").textContent = `${guestSelectedIndexes(slot).length} of ${indexes.filter((index) =>
    guestEntryIsSelectable(files[index])).length} file(s) selected.`;
  element("guestFilesSelectAll").disabled = !indexes.some((index) => guestEntryIsSelectable(files[index]));
}

function openGuestFilesPopup(slot, title)
{
  guestFilesSlot = slot;
  element("guestFilesTitle").textContent = title || "Select files";
  renderGuestFilesPopup();
  guestFilesDialog.showModal();
}

function toggleGuestSelectAll()
{
  const slot = guestFilesSlot;
  const files = guestSlots[slot].files;
  const indexes = guestVisibleIndexes(slot).filter((index) => guestEntryIsSelectable(files[index]));
  const everySelected = indexes.length > 0 && indexes.every((index) => guestSlots[slot].selected.has(index));
  for (const index of indexes)
  {
    if (everySelected)
    {
      guestSlots[slot].selected.delete(index);
    }
    else
    {
      guestSlots[slot].selected.add(index);
    }
  }
  renderGuestFilesPopup();
}

element("guestFilesSelectAll").addEventListener("click", toggleGuestSelectAll);
guestFilesBody.addEventListener("click", (event) =>
{
  const row = event.target.closest("tr");
  const box = row ? row.querySelector("input[data-guest-index]") : null;
  if (!box || box.disabled)
  {
    return;
  }
  if (event.target !== box)
  {
    box.checked = !box.checked;
  }
  const selected = guestSlots[guestFilesSlot].selected;
  if (box.checked)
  {
    selected.add(Number(box.dataset.guestIndex));
  }
  else
  {
    selected.delete(Number(box.dataset.guestIndex));
  }
  renderGuestFilesPopup();
});

element("app").addEventListener("change", (event) =>
{
  const id = event.target.id;
  const guestMatch = /^(guest[AB])(Machine|Image|User)$/.exec(id);
  if (guestMatch)
  {
    const [, slot, part] = guestMatch;
    if (part === "Machine")
    {
      run(() => loadGuestImages(slot));
    }
    else if (part === "Image")
    {
      run(() => loadGuestListing(slot));
    }
    else
    {
      renderGuestTable(slot);
      refreshGuestUploadPreview();
    }
  }
  if (id === "guestUploadFiles" || id === "guestUploadOverwrite")
  {
    refreshGuestUploadPreview();
  }
  if (id === "sdSourceMachine")
  {
    run(loadSdFiles);
  }
  if (id === "downloadMachine")
  {
    run(() => loadImageOptions("download"));
  }
  if (id === "copySourceMachine")
  {
    run(() => loadImageOptions("copySource"));
  }
  if (id === "uploadMachine")
  {
    element("uploadMachineLabel").textContent = event.target.value;
    element("configTargetLabel").textContent = event.target.value;
    updateHostFolderLabel(event.target.value);
  }
  if (id === "uploadKind")
  {
    const configuration = event.target.value === "drivesCfg";
    element("uploadImageSection").hidden = configuration;
    element("uploadConfigSection").hidden = !configuration;
  }
  if (id === "downloadMachine")
  {
    element("downloadMachineLabel").textContent = event.target.value;
  }
  if (id === "managerMachine")
  {
    run(refreshManager);
  }
  if (id === "imageFiles")
  {
    const files = Array.from(event.target.files);
    const machine = element("uploadMachine").value;
    hostFiles.delete(machine);
    hostDirectoryNames.delete(hostDirectoryKey("upload", machine));
    updateHostFolderLabel(machine,
      files.length ? `${files.length} individual Computer file(s) selected.` : "No Computer directory selected.");
  }
});

  if (event.target.id === "guestToSdButton")
  {
    run(copyGuestFilesToSd);
  }
  if (event.target.id === "guestRenameButton")
  {
    run(renameGuestFile);
  }
  if (event.target.id === "guestDeleteButton")
  {
    run(deleteGuestFiles);
  }
  if (event.target.id === "loadDownloadImages")
  {
    run(() => loadImageOptions("download"));
  }
  if (event.target.id === "managerRefresh")
  {
    run(refreshManager);
  }
  if (event.target.id === "chooseUploadFolder")
  {
    run(selectHostDirectory);
  }
  if (event.target.id === "reuseUploadFolder")
  {
    run(reuseHostDirectory);
  }
  if (event.target.id === "downloadImageButton")
  {
    const path = element("downloadImage").value;
    if (!path)
    {
      showStatus("Select a whole disk image first.");
      return;
    }
    const name = path.split("/").pop();
    run(() => downloadImageToComputer(path, name));
  }
  if (event.target.id === "copyImageButton")
  {
    run(async () =>
    {
      const source = element("copySourceImage").value;
      const destinationName = element("copyDestinationName").value.trim();
      if (!source || !destinationName || destinationName.includes("/") ||
          !/\.(dsk|img|po|woz|2mg)$/i.test(destinationName))
      {
        throw new Error("Select a source image and enter a new disk-image filename without a directory.");
      }
      const destination = imagePath(element("copyDestinationMachine").value, destinationName);
      const overwrite = element("copyOverwrite").checked;
      if (overwrite && !confirm(`Replace ${destination}? It may be mapped in drives.cfg, including as RO. The mapping will not be changed; the existing image is preserved during commit.`))
      {
        return;
      }
      if (!confirm(`Copy complete image ${source} to ${destination}? The source remains unchanged.`))
      {
        return;
      }
      showStatus("Copying whole disk image and verifying bytes...");
      const response = await api(`/api/images/copy${imageOperationQuery(source, destination)}`,
        {method: "POST", headers: overwrite ? {"X-Overwrite": "1"} : {}});
      showStatus(await response.text());
    });
  }
  if (event.target.id === "restoreBackup")
  {
    run(async () =>
    {
      const destination = prompt("Enter the intended destination relative to /retro/images/ (example cpm80/work.dsk):");
      if (!destination || !confirm(`Restore the preserved backup to ${destination}? Destination must not exist. If mapped, drives.cfg will not be changed.`))
      {
        return;
      }
      const response = await api(`/api/images/recover?destination=${encodeURIComponent(destination)}`,
        {method: "POST"});
      showStatus(await response.text());
      await refreshManager();
    });
  }
});
element("app").addEventListener("submit", (event) =>
{
  if (event.target.id === "guestUploadForm")
  {
    event.preventDefault();
    run(submitGuestUpload);
  }
  if (event.target.id === "configUploadForm")
  {
    event.preventDefault();
    run(async () =>
    {
      const machine = element("uploadMachine").value;
      const files = Array.from(element("configFile").files);
      if (files.length !== 1)
      {
        throw new Error("Select exactly one drives.cfg file on the Computer.");
      }
      const file = files[0];
      if (file.size === 0 || file.size > 16384)
      {
        throw new Error("drives.cfg must be between 1 and 16384 bytes.");
      }
      if (!confirm(`Replace /retro/images/${machine}/drives.cfg with ${file.name} (${file.size} bytes)? The existing drive configuration is replaced; the emulator reads the new one at its next start.`))
      {
        return;
      }
      element("configUploadButton").disabled = true;
      try
      {
        await transferUpload("images", imagePath(machine, "drives.cfg"), file, true, "Uploading drives.cfg");
        element("configFile").value = "";
        showStatus(`Copied ${file.name} to /retro/images/${machine}/drives.cfg.`);
      }
      finally
      {
        element("configUploadButton").disabled = false;
        hideProgress();
      }
    });
  }
  if (event.target.id === "imageUploadForm")
  {
    event.preventDefault();
    run(async () =>
    {
      const machine = element("uploadMachine").value;
      const files = hostFiles.has(machine) ? hostFiles.get(machine) : Array.from(element("imageFiles").files);
      if (files.length === 0)
      {
        throw new Error("Choose a Computer folder containing disk images or select individual image files first.");
      }
      const fileNames = new Set();
      for (const file of files)
      {
        if (!/\.(dsk|img|po|woz|2mg)$/i.test(file.name))
        {
          throw new Error(`Not a recognized whole-image filename: ${file.name}`);
        }
        if (fileNames.has(file.name.toLowerCase()))
        {
          throw new Error(`The selected Computer folder contains duplicate image filenames: ${file.name}. Select files from one directory or rename duplicates first.`);
        }
        fileNames.add(file.name.toLowerCase());
      }
      const overwrite = element("overwrite").checked;
      if (overwrite && !confirm("OVERWRITE is enabled. Existing images may be mapped in drives.cfg, including as RO. Mappings will not be changed. Continue?"))
      {
        return;
      }
      element("uploadButton").disabled = true;
      let completed = 0;
      try
      {
        for (const file of files)
        {
          const path = imagePath(machine, file.name);
          showStatus(`Uploading ${file.name} (${completed + 1}/${files.length})...`);
          await transferUpload("images", path, file, overwrite, `Uploading ${file.name}`);
          completed++;
        }
        element("imageFiles").value = "";
        hostFiles.delete(machine);
        hostDirectoryNames.delete(hostDirectoryKey("upload", machine));
        updateHostFolderLabel(machine, "Upload complete. Select another Computer folder or files to continue.");
        showStatus(`Uploaded ${completed} whole image(s) to /retro/images/${machine}/.`);
      }
      finally
      {
        element("uploadButton").disabled = false;
        hideProgress();
      }
    });
  }
});
window.addEventListener("popstate", (event) =>
{
  const destination = event.state || {screen: "home", functionId: null};
  state.screen = destination.screen;
  state.functionId = destination.functionId;
  render();
});
window.addEventListener("error", (event) =>
{
  showStatus(event.message || "A browser error interrupted the operation.");
});
history.replaceState({screen: "home", functionId: null}, "", "#home");
render();
</script>
</body>
</html>
