<html lang="en">
<head>
<meta charset="utf-8">

<title>Retro SD Disk Image Manager</title>
<style>
:root
{

  font: 16px system-ui, sans-serif;
  color: #1d1d1f;

}
*
{

}

{

}
header
{

}

<header id="menuBar" role="menubar" aria-label="Application menu"></header>

<dialog id="helpDialog">

</dialog>

  <h2 id="guestFilesTitle">Select files</h2>
  <div class="actions">
    <button id="guestFilesSelectAll" type="button">Select All</button>
    <span id="guestFilesCount" class="muted"></span>
  </div>
  <div id="guestFilesScroll">
    <table>
      <thead><tr><th>Select</th><th>Name</th><th>Type</th><th>User</th><th>Bytes</th><th>Flags</th><th></th></tr></thead>
      <tbody id="guestFilesBody"></tbody>
    </table>
  </div>
  <form method="dialog" class="dialog-actions"><button>Done</button></form>
</dialog>
<input id="computerFolderInput" type="file" webkitdirectory multiple accept=".dsk,.img,.po,.woz,.2mg" hidden>
<script>
"use strict";
const machines =
[
  ["cpm80", "CP/M-80"],
  ["cpm86", "CP/M-86"],
  ["ucsd", "UCSD Pascal"],
  ["apple2", "Apple II"],
  ["swtpc", "SWTPC 6800"]
];
const functions =
[
  {id: "computer-image-upload", number: "1", menu: "Computer → SD images", title: "Copy disk images from Computer to SD", available: true},
  {id: "computer-guest-upload", number: "2", menu: "Computer → Image files", title: "Copy single files from Computer to an SD disk image", available: true},
  {id: "image-computer-download", number: "3", menu: "SD → Computer images", title: "Copy disk images from SD to Computer", available: true},
  {id: "guest-computer-download", number: "4", menu: "Image → Computer files", title: "Copy single files from an SD disk image to Computer", available: true},
  {id: "guest-image-copy", number: "5", menu: "Image → Image files", title: "Copy single files from disk image to disk image", available: true},
  {id: "image-image-copy", number: "6", menu: "SD → SD images", title: "Copy whole disk images from SD to SD", available: true},
  {id: "manage-images", number: "7", menu: "Manage images", title: "Browse and manage SD image files", available: true},
  {id: "sd-files-copy", number: "8", menu: "SD → SD files", title: "Copy ordinary files between SD directories", available: false, reason: "ordinary SD-file copy is not implemented"},
  {id: "file-guest-copy", number: "9", menu: "SD files ⇄ Image", title: "Copy ordinary SD files to or from guest images", available: true},
  {id: "computer-sd-files", number: "10", menu: "Computer ⇄ SD files", title: "Copy ordinary files between Computer and SD", available: false, reason: "ordinary SD-file transfer is not implemented"},
  {id: "guest-file-manage", number: "11", menu: "Rename / Delete", title: "Rename or delete guest files", available: true}
];
const state =
{
  screen: "home",
  functionId: null,
  machine: "cpm80",
  managerMachine: "cpm80"
};
const hostDirectories = new Map();
const hostFiles = new Map();
const hostDirectoryNames = new Map();
const app = document.getElementById("app");
const menuBar = document.getElementById("menuBar");
const helpDialog = document.getElementById("helpDialog");
const element = (id) => document.getElementById(id);
const directoryDatabaseName = "retroDiskImageManager";
let guestUploadPending = [];
let guestUploadBusy = false;
let imageUploadBusy = false;
let imagePreviewToken = 0;

function escapeHtml(value)
{
  return String(value).replace(/[&<>"']/g, (character) =>
  {
    const entities =
    {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#39;"
    };
    return entities[character];
  });
}

function machineOptions(selected)
{
  return machines.map(([id, label]) =>
    `<option value="${id}"${id === selected ? " selected" : ""}>${label}</option>`).join("");
}

function showStatus(message)
{
  element("status").textContent = message;
}

function showProgress(label, loaded, total)
{
  const progress = element("progress");
  progress.hidden = false;
  progress.value = total > 0 ? Math.min(100, loaded / total * 100) : 0;
  const percentage = total > 0 ? ` (${Math.floor(loaded / total * 100)}%)` : "";
  element("progressText").textContent = `${label}: ${loaded} / ${total} bytes${percentage}`;
}

function hideProgress()
{
  element("progress").hidden = true;
  element("progressText").textContent = "";
}

function validImageName(name)
{
  if (name.includes("/") || !/\.(dsk|img|po|woz|2mg)$/i.test(name))
  {
    showStatus("Use a plain image filename (.dsk, .img, .po, .woz, .2mg) without a directory.");
    return false;
  }
  return true;
}

function imagePath(machine, file)
{
  return [machine, file].filter(Boolean).join("/");
}

function apiPath(area, path)
{
  return `?area=${area}&path=${encodeURIComponent(path)}`;
}

function imageOperationQuery(source, destination)
{
  return `?source=${encodeURIComponent(source)}&destination=${encodeURIComponent(destination)}`;
}

async function api(path, options = {})
{
  const response = await fetch(path,
  {
    ...options,
    headers: options.headers || {}
  });
  if (!response.ok)
  {
    throw new Error(await response.text());
  }
  return response;
}

function hostDirectoryKey(direction, machine)
{
  return `${direction}:${machine}`;
}

function supportsHostDirectoryAccess()
{
  return window.isSecureContext && typeof window.showDirectoryPicker === "function";
}

function openHostDirectoryDatabase()
{
  return new Promise((resolve, reject) =>
  {
    if (!window.indexedDB)
    {
      reject(new Error("This browser does not provide IndexedDB for remembering Computer folders."));
      return;
    }
    const request = window.indexedDB.open(directoryDatabaseName, 1);
    request.onupgradeneeded = () =>
    {
      request.result.createObjectStore("directories");
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("Could not open browser folder storage."));
    request.onblocked = () => reject(new Error("Browser folder storage is blocked by another open manager page."));
  });
}

async function saveHostDirectory(direction, machine, handle)
{
  const database = await openHostDirectoryDatabase();
  return new Promise((resolve, reject) =>
  {
    const transaction = database.transaction("directories", "readwrite");
    try
    {
      transaction.objectStore("directories").put(handle, hostDirectoryKey(direction, machine));
    }
    catch (error)
    {
      database.close();
      reject(error);
      return;
    }
    transaction.oncomplete = () =>
    {
      database.close();
      resolve();
    };
    transaction.onerror = () =>
    {
      database.close();
      reject(transaction.error || new Error("Could not remember the Computer folder in this browser."));
    };
    transaction.onabort = () =>
    {
      database.close();
      reject(transaction.error || new Error("Could not remember the Computer folder in this browser."));
    };
  });
}

async function loadHostDirectory(direction, machine)
{
  const database = await openHostDirectoryDatabase();
  return new Promise((resolve, reject) =>
  {
    const transaction = database.transaction("directories", "readonly");
    const request = transaction.objectStore("directories").get(hostDirectoryKey(direction, machine));
    request.onsuccess = () =>
    {
      database.close();
      resolve(request.result || null);
    };
    request.onerror = () =>
    {
      database.close();
      reject(request.error || new Error("Could not read the remembered Computer folder."));
    };
  });
}

function hostFolderLabelId()
{
  return "computerUploadFolder";
}

function updateHostFolderLabel(machine, message)
{
  const label = element(hostFolderLabelId());
  if (!label)
  {
    return;
  }
  const pending = hostFiles.get(machine);
  label.textContent = message || hostDirectoryNames.get(hostDirectoryKey("upload", machine)) ||
    (pending && pending.length ? `${pending.length} Computer file(s) ready.` : "No Computer directory selected.");
}

function fileKey(file)
{
  return `${file.name}|${file.size}|${file.lastModified}`;
}

function mergeFiles(existing, added)
{
  const keys = new Set(existing.map(fileKey));
  const merged = existing.slice();
  for (const file of added)
  {
    if (!keys.has(fileKey(file)))
    {
      keys.add(fileKey(file));
      merged.push(file);
    }
  }
  return merged;
}

function dragHasFiles(event)
{
  return Boolean(event.dataTransfer) && Array.from(event.dataTransfer.types || []).includes("Files");
}

function readAllDirectoryEntries(directoryEntry)
{
  const reader = directoryEntry.createReader();
  const entries = [];
  const readBatch = () => new Promise((resolve, reject) =>
  {
    reader.readEntries(async (batch) =>
    {
      if (batch.length === 0)
      {
        resolve(entries);
        return;
      }
      entries.push(...batch);
      try
      {
        resolve(await readBatch());
      }
      catch (error)
      {
        reject(error);
      }
    }, reject);
  });
  return readBatch();
}

async function collectDroppedFiles(dataTransfer)
{
  const plainFiles = Array.from(dataTransfer.files);
  const entries = Array.from(dataTransfer.items || [])
    .filter((item) => item.kind === "file")
    .map((item) => typeof item.webkitGetAsEntry === "function" ? item.webkitGetAsEntry() : null);
  const result = {files: [], notes: []};
  if (entries.length !== plainFiles.length || entries.some((entry) => !entry))
  {
    result.files = plainFiles;
    return result;
  }
  for (const entry of entries)
  {
    if (entry.isFile)
    {
      result.files.push(await new Promise((resolve, reject) => entry.file(resolve, reject)));
    }
    else
    {
      let taken = 0;
      let nested = 0;
      for (const child of await readAllDirectoryEntries(entry))
      {
        if (child.isFile)
        {
          result.files.push(await new Promise((resolve, reject) => child.file(resolve, reject)));
          taken++;
        }
        else
        {
          nested++;
        }
      }
      result.notes.push(`Folder ${entry.name}: ${taken} file(s) taken from its top level` +
        (nested ? `; ${nested} nested folder(s) ignored.` : "."));
    }
  }
  return result;
}

function applyDroppedFiles(kind, collected)
{
  if (collected.files.length === 0)
  {
    showStatus(["No files were found in the drop.", ...collected.notes].join("\n"));
    return;
  }
  if (kind === "images")
  {
    const machine = element("uploadMachine").value;
    hostFiles.set(machine, mergeFiles(hostFiles.get(machine) || [], collected.files));
    hostDirectoryNames.delete(hostDirectoryKey("upload", machine));
    updateHostFolderLabel(machine);
    refreshImageUploadPreview();
  }
  else if (kind === "guest")
  {
    guestUploadPending = mergeFiles(guestUploadPending, collected.files);
    refreshGuestUploadPreview();
  }
  showStatus([`Added ${collected.files.length} file(s) to the list. Nothing is copied until you press the Copy button.`,
    ...collected.notes].join("\n"));
}

function supportedImageFiles(files)
{
  return files.filter((file) => /\.(dsk|img|po|woz|2mg)$/i.test(file.name));
}

async function getFilesInHostDirectory(handle)
{
  const files = [];
  for await (const [name, entry] of handle.entries())
  {
    if (entry.kind === "file" && /\.(dsk|img|po|woz|2mg)$/i.test(name))
    {
      files.push(await entry.getFile());
    }
  }
  return files;
}

async function selectHostDirectory()
{
  const machine = element("uploadMachine").value;
  if (!supportsHostDirectoryAccess())
  {
    element("computerFolderInput").value = "";
    element("computerFolderInput").click();
    return;
  }

  let handle;
  try
  {
    handle = await window.showDirectoryPicker({mode: "read"});
  }
  catch (error)
  {
    if (error.name === "AbortError")
    {
      return;
    }
    throw error;
  }
  const key = hostDirectoryKey("upload", machine);
  hostDirectories.set(key, handle);
  hostDirectoryNames.set(key, handle.name);
  try
  {
    await saveHostDirectory("upload", machine, handle);
  }
  catch (error)
  {
    showStatus(`Selected ${handle.name}, but this browser could not remember it: ${error.message}`);
  }

  const files = supportedImageFiles(await getFilesInHostDirectory(handle));
  hostFiles.set(machine, files);
  updateHostFolderLabel(machine,
    `${handle.name}: ${files.length} supported disk image(s) selected.`);
  refreshImageUploadPreview();
  if (files.length === 0)
  {
    showStatus(`No supported disk images were found directly inside ${handle.name}.`);
  }
}

async function reuseHostDirectory()
{
  const machine = element("uploadMachine").value;
  const key = hostDirectoryKey("upload", machine);
  const handle = hostDirectories.get(key) || await loadHostDirectory("upload", machine);
  if (!handle)
  {
    showStatus(`No remembered Computer folder exists for ${machine}. Choose a Computer folder first.`);
    return;
  }

  let permission = await handle.queryPermission({mode: "read"});
  if (permission !== "granted")
  {
    permission = await handle.requestPermission({mode: "read"});
  }
  if (permission !== "granted")
  {
    showStatus(`Permission to use ${handle.name} was not granted. Choose the Computer folder again.`);
    return;
  }

  hostDirectories.set(key, handle);
  hostDirectoryNames.set(key, handle.name);
  const files = supportedImageFiles(await getFilesInHostDirectory(handle));
  hostFiles.set(machine, files);
  updateHostFolderLabel(machine,
    `${handle.name}: ${files.length} supported disk image(s) selected.`);
  refreshImageUploadPreview();
  if (files.length === 0)
  {
    showStatus(`No supported disk images were found directly inside ${handle.name}.`);
  }
}

function helpContent()
{
  if (state.screen === "home")
  {
    return ["Retro Disk Manager",
      "<h3>What is this?</h3>" +
      "<p>Retro Disk Manager lets you work with the disk images on the SD card of the ESP32 retro computer from your web browser. You do not need any extra program on your Mac, Windows or Linux computer, and no emulator has to be running.</p>" +
      "<h3>The menu bar</h3>" +
      "<ul>" +
      "<li><b>Computer → SD</b>: bring things from your computer onto the SD card, either complete disk images or single files that are placed inside a disk image.</li>" +
      "<li><b>SD → Computer</b>: take things from the SD card to your computer, either complete disk images or single files from inside a disk image.</li>" +
      "<li><b>SD → SD</b>: copy inside the SD card, either whole disk images or single files from one disk image to another.</li>" +
      "<li><b>Manage</b>: browse the images on the SD card, copy, rename or delete them, and rename or delete single files inside a disk image.</li>" +
      "<li><b>Help</b>: this text. Every function has its own Help with more detail.</li>" +
      "</ul>" +
      "<p>Click a menu title to open the menu, then click an item. Items that are greyed out are not implemented yet. When a function is open, the menu bar shows its name, <b>Back to Main</b> and <b>Help</b>.</p>" +

async function showHelp()
{
  const [title, builtIn] = helpContent();
  let body = builtIn;
  try
  {
    const response = await fetch(`/api/help?id=${encodeURIComponent(state.screen === "home" ? "home" : state.functionId)}`, {cache: "no-store"});
    if (response.ok)
    {
      body = await response.text();
    }
  }
  catch (error)
  {
    //-- Fall back to the built-in text when LittleFS has no help file.
  }
  element("helpTitle").textContent = title;
  element("helpBody").innerHTML = body;
  helpDialog.showModal();
}

function navigate(screen, functionId = state.functionId, addHistory = true)
{
  state.screen = screen;
  state.functionId = functionId;
  showStatus("");
  hideProgress();
  if (addHistory)
  {
    history.pushState({screen, functionId}, "", `#${screen}${functionId ? `/${functionId}` : ""}`);
  }
  render();
}

async function listPath(area, path)
{
  const response = await api(`/api/list${apiPath(area, path)}`);
  return response.json();
}

async function loadImageOptions(prefix)
{
  try
  {
    const directory = element(prefix === "download" ? "downloadMachine" : "copySourceMachine").value;
    const entries = await listPath("images", directory);
    const select = element(prefix === "download" ? "downloadImage" : "copySourceImage");
    select.replaceChildren(new Option(prefix === "download" ? "Select an image" : "Select a source image", ""));
    if (prefix === "download")
    {
      const configuration = entries.find((item) => !item.directory && item.name === "drives.cfg");
      const configurationState = configuration ? `${configuration.size} bytes` : "not present on the SD card";
      select.add(new Option(`drives.cfg — drive configuration (${configurationState})`,
        imagePath(directory, "drives.cfg")));
    }
    for (const entry of entries.filter((item) => !item.directory && /\.(dsk|img|po|woz|2mg)$/i.test(item.name)))
    {
      const relative = imagePath(directory, entry.name);
      const mapping = entry.mapped ? " — mapped (manager access allowed)" : " — unassigned";
      select.add(new Option(`${entry.name} (${entry.size} bytes${mapping})`, relative));
    }
  }
  catch (error)
  {
    showStatus(error.message);
  }
}

const readSizeLimit = 262144;

function isTextName(name)
{
  if (/^read[ ._-]?me$/i.test(name))
  {
    return true;
  }
  const dot = name.lastIndexOf(".");
  return dot >= 0 && textExtensions.has(name.slice(dot + 1).toUpperCase());
}

//-- Binary files (for example .HST, .COM) are refused when more than a few bytes are control characters.
function looksLikeText(bytes)
{
  let odd = 0;
  for (const byte of bytes)
  {
    if (byte === 0x1A)
    {
      break;
    }
    if (byte === 0 || (byte < 32 && byte !== 9 && byte !== 10 && byte !== 12 && byte !== 13 && byte !== 27) || byte === 127)
    {
      ++odd;
    }
  }
  return odd <= Math.max(2, bytes.length / 100);
}

async function readTextFile(url, name, size)
{
  if (size > readSizeLimit)
  {
    showStatus(`${name} is too large to show (${size} bytes, limit ${readSizeLimit}). Download it instead.`);
    return;
  }
  const response = await api(url);
  const bytes = new Uint8Array(await response.arrayBuffer());
  if (!looksLikeText(bytes))
  {
    showStatus(`${name} does not look like plain text; it cannot be shown. Download it instead.`);
    return;
  }
  //-- CP/M pads text with 0x1A; classic systems use CR or CR LF line ends.
  let end = bytes.indexOf(0x1A);
  end = end < 0 ? bytes.length : end;
  let text = new TextDecoder("windows-1252").decode(bytes.subarray(0, end));
  text = text.replace(/\r\n?/g, "\n").replace(/\0/g, "");
  element("readTitle").textContent = name;
  element("readBody").textContent = text.length > 0 ? text : "(empty file)";
  element("readDialog").showModal();
}

function readButton(url, name, size)
{
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = "Read";
  button.onclick = () => run(() => readTextFile(url, name, size));
  return button;
}

function downloadFile(area, path, name)
{
  downloadUrl(`/api/file${apiPath(area, path)}`, name);
}

function downloadUrl(url, name)
{
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
}

async function downloadImageToComputer(path, name)
{
  await downloadToComputer(`/api/file${apiPath("images", path)}`, name);
}

async function downloadToComputer(url, name)
{
  if (!window.isSecureContext || typeof window.showSaveFilePicker !== "function")
  {
    downloadUrl(url, name);
    showStatus(`Download requested for ${name}. If the browser does not prompt, enable its “Ask where to save each file” setting.`);
    return;
  }

  let fileHandle;
  try
  {
    fileHandle = await window.showSaveFilePicker({suggestedName: name});
  }
  catch (error)
  {
    if (error.name === "AbortError")
    {
      showStatus("Download cancelled.");
      return;
    }
    throw error;
  }

  const response = await fetch(url);
  if (!response.ok)
  {
    throw new Error(await response.text());
  }
  if (!response.body)
  {
    throw new Error("This browser cannot stream the image to the selected destination.");
  }

  const total = Number(response.headers.get("Content-Length")) || Number(response.headers.get("X-Guest-Size")) || 0;
  const writable = await fileHandle.createWritable();
  let reader;
  let loaded = 0;
  try
  {
    reader = response.body.getReader();
    while (true)
    {
      const {done, value} = await reader.read();
      if (done)
      {
        break;
      }
      await writable.write(value);
      loaded += value.byteLength;
      showProgress(`Downloading ${name}`, loaded, total);
    }
    await writable.close();
  }
  catch (error)
  {
    try
    {
      await writable.abort();
    }
    catch (abortError)
    {
      throw new Error(`${error.message} (Could not clean up the incomplete Computer file: ${abortError.message})`);
    }
    throw error;
  }
  finally
  {
    if (reader)
    {
      reader.releaseLock();
    }
    hideProgress();
  }
  showStatus(`Downloaded ${loaded} bytes to the selected Computer destination.`);
}

function transferUpload(area, path, file, overwrite, progressLabel)
{
  if (file.size > 4294967294)
  {
    return Promise.reject(new Error(`Maximum file size is 4 GiB minus 2 bytes: ${file.name}`));
  }
  const request = new XMLHttpRequest();
  request.open("PUT", `/api/file${apiPath(area, path)}`);
  request.setRequestHeader("Content-Type", "application/octet-stream");
  if (overwrite)
  {
    request.setRequestHeader("X-Overwrite", "1");
  }
  request.upload.onprogress = (event) =>
  {
    showProgress(progressLabel, event.loaded, event.lengthComputable ? event.total : file.size);
  };
  return new Promise((resolve, reject) =>
  {
    request.onload = () =>
    {
      if (request.status >= 200 && request.status < 300)
      {
        resolve(request.responseText);
      }
      else
      {
        reject(new Error(request.responseText || `Upload failed (${request.status}).`));
      }
    };
    request.onerror = () => reject(new Error("Connection lost. Check the USB terminal."));
    request.onabort = () => reject(new Error("Transfer cancelled."));
    request.send(file);
  });
}

async function imageUploadPlan(machine)
{
  const files = hostFiles.get(machine) || [];
  if (files.length === 0)
  {
    return [];
  }
  const entries = await listPath("images", machine);
  const existing = new Map(entries.filter((entry) => !entry.directory).map((entry) => [entry.name.toLowerCase(), entry]));
  const overwrite = element("overwrite").checked;
  const seen = new Set();
  return files.map((file) =>
  {
    const lowerName = file.name.toLowerCase();
    const current = existing.get(lowerName);
    let result = "New";
    let accepted = true;
    if (!/\.(dsk|img|po|woz|2mg)$/i.test(file.name))
    {
      result = "Not a disk image name (.dsk .img .po .woz .2mg)";
      accepted = false;
    }
    else if (file.size > 4294967294)
    {
      result = "Larger than 4 GiB minus 2 bytes";
      accepted = false;
    }
    else if (seen.has(lowerName))
    {
      result = "Duplicate name in this list";
      accepted = false;
    }
    else if (current)
    {
      const mapped = current.mapped ? " (mapped in drives.cfg)" : "";
      result = overwrite ? `Exists: will be OVERWRITTEN${mapped}` : "Exists: will be skipped";
      accepted = overwrite;
    }
    seen.add(lowerName);
    return {file, destination: `/retro/images/${machine}/${file.name}`, result, accepted, exists: Boolean(current)};
  });
}

async function refreshImageUploadPreview()
{
  const body = element("imageUploadPreview");
  if (!body)
  {
    return;
  }
  const token = ++imagePreviewToken;
  const machine = element("uploadMachine").value;
  let plan;
  try
  {
    plan = await imageUploadPlan(machine);
  }
  catch (error)
  {
    if (token === imagePreviewToken)
    {
      showStatus(error.message || "Could not read the SD directory for the preview.");
    }
    return;
  }
  if (token !== imagePreviewToken || !element("imageUploadPreview"))
  {
    return;
  }
  body.replaceChildren();
  plan.forEach((item, index) =>
  {
    const row = document.createElement("tr");
    for (const text of [item.file.name, item.destination, String(item.file.size), item.result])
    {
      const cell = document.createElement("td");
      cell.textContent = text;
      row.append(cell);
    }
    const removeCell = document.createElement("td");
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "Remove";
    remove.dataset.pendingRemove = "images";
    remove.dataset.index = String(index);
    removeCell.append(remove);
    row.append(removeCell);
    body.append(row);
  });
  const todo = plan.filter((item) => item.accepted);
  const skipped = plan.filter((item) => item.result === "Exists: will be skipped").length;
  const rejected = plan.length - todo.length - skipped;
  element("imageUploadHeader").textContent = `Destination: /retro/images/${machine}/ on the SD card.`;
  element("imageUploadTotals").textContent = plan.length === 0 ? "No files in the list." :
    `${plan.length} file(s): ${todo.length} will be written (${formatBytes(todo.reduce((sum, item) => sum + item.file.size, 0))}), ` +
    `${skipped} skipped, ${rejected} rejected.`;
  element("uploadButton").disabled = imageUploadBusy || (plan.length > 0 && todo.length === 0);
}

async function submitImageUpload()
{
  const machine = element("uploadMachine").value;
  const plan = await imageUploadPlan(machine);
  if (plan.length === 0)
  {
    throw new Error("Drop disk image files here, choose a Computer folder or select individual image files first.");
  }
  const todo = plan.filter((item) => item.accepted);
  if (todo.length === 0)
  {
    throw new Error("Nothing can be copied: " + plan.map((item) => `${item.file.name}: ${item.result}`).join("; "));
  }
  const overwrite = element("overwrite").checked;
  if (overwrite && todo.some((item) => item.exists) &&
      !confirm("OVERWRITE is enabled. Existing images may be mapped in drives.cfg, including as RO. Mappings will not be changed. Continue?"))
  {
    return;
  }
  imageUploadBusy = true;
  element("uploadButton").disabled = true;
  const lines = plan.filter((item) => !item.accepted).map((item) => `${item.file.name}: not copied (${item.result})`);
  const stored = new Set();
  try
  {
    for (const item of todo)
    {
      showStatus(`Uploading ${item.file.name} (${stored.size + 1}/${todo.length})...`);
      try
      {
        await transferUpload("images", imagePath(machine, item.file.name), item.file, overwrite, `Uploading ${item.file.name}`);
        stored.add(item.file);
        lines.push(`${item.file.name}: stored`);
      }
      catch (error)
      {
        lines.push(`${item.file.name}: FAILED - ${error.message}`);
        lines.push(...todo.slice(todo.indexOf(item) + 1).map((rest) => `${rest.file.name}: not attempted`));
        break;
      }
    }
  }
  finally
  {
    imageUploadBusy = false;
    hideProgress();
    hostFiles.set(machine, (hostFiles.get(machine) || []).filter((file) => !stored.has(file)));
    hostDirectoryNames.delete(hostDirectoryKey("upload", machine));
    updateHostFolderLabel(machine);
    await refreshImageUploadPreview();
  }
  showStatus(`${lines.join("\n")}\nUploaded ${stored.size} whole image(s) to /retro/images/${machine}/.`);
}

async function refreshManager()
{
  state.managerMachine = element("managerMachine").value;
  const rows = await listPath("images", state.managerMachine);
  element("managerLocation").textContent = `/retro/images/${state.managerMachine}/`;
  const body = element("managerEntries");
  body.replaceChildren();
  rows.sort((first, second) => Number(second.directory) - Number(first.directory) || first.name.localeCompare(second.name));
  for (const entry of rows)
  {
    const row = document.createElement("tr");
    const name = document.createElement("td");
    const size = document.createElement("td");
    const actions = document.createElement("td");
    name.textContent = entry.name;
    size.textContent = `${entry.size} bytes${entry.mapped ? " — mapped; manager access allowed" : ""}`;
    if (!entry.directory)
    {
      const relative = imagePath(state.managerMachine, entry.name);
      const download = document.createElement("button");
      download.textContent = "Download";
      download.onclick = () => downloadFile("images", relative, entry.name);
      actions.append(download);
      if (isTextName(entry.name))
      {
        actions.append(readButton(`/api/file${apiPath("images", relative)}`, entry.name, entry.size));
      }
      if (/\.(dsk|img|po|woz|2mg)$/i.test(entry.name))
      {
        const copy = document.createElement("button");
        copy.textContent = "Copy image";
        copy.onclick = async () =>
        {
          const newName = prompt(`Copy complete image to a new filename in /retro/images/${state.managerMachine}/:`,
            `copy-${entry.name}`);
          if (!newName || !validImageName(newName))
          {
            return;
          }
          const destinationName = imagePath(state.managerMachine, newName);
          if (element("managerOverwrite").checked &&
              !confirm("Overwrite destination? It may be mapped in drives.cfg, including as RO. The mapping will not be changed; the previous image is preserved during commit."))
          {
            return;
          }
          const response = await api(`/api/images/copy${imageOperationQuery(relative, destinationName)}`,
            {method: "POST", headers: element("managerOverwrite").checked ? {"X-Overwrite": "1"} : {}});
          showStatus(await response.text());
          await refreshManager();
        };
        const rename = document.createElement("button");
        rename.textContent = "Rename / move";
        rename.onclick = async () =>
        {
          const newName = prompt(`New filename in /retro/images/${state.managerMachine}/:`, entry.name);
          if (!newName || newName === entry.name || !validImageName(newName))
          {
            return;
          }
          const destinationName = imagePath(state.managerMachine, newName);
          if (!confirm(`${entry.mapped ? "WARNING: this image is mapped in drives.cfg. " : ""}Move ${relative} to ${destinationName}? The mapping will not be changed.`))
          {
            return;
          }
          const response = await api(`/api/images/rename${imageOperationQuery(relative, destinationName)}`,
            {method: "POST"});
          showStatus(await response.text());
          await refreshManager();
        };
        actions.append(copy, rename);
      }
      const remove = document.createElement("button");
      remove.textContent = "Delete";
      remove.disabled = entry.name.toLowerCase() === "drives.cfg" || entry.name.toLowerCase() === "config.cfg";
      remove.onclick = async () =>
      {
        const warning = entry.mapped ?
          `WARNING: ${relative} is referenced by drives.cfg. Deleting it can break emulator startup or drive access. Delete anyway?` :
          `Delete ${relative}? This cannot be undone.`;
        if (!confirm(warning))
        {
          return;
        }
        const response = await api(`/api/file${apiPath("images", relative)}`, {method: "DELETE"});
        showStatus(await response.text());
        await refreshManager();
      };
      actions.append(remove);
    }
    row.append(name, size, actions);
    body.append(row);
  }
}

const guestMachineIds = ["cpm80", "cpm86", "apple2", "ucsd"];
const guestImagePattern = /\.(dsk|img|po|woz|2mg)$/i;
const guestSlots =
{
  guestA: {image: "", info: null, files: [], selected: new Set()},
  guestB: {image: "", info: null, files: [], selected: new Set()}
};

function guestQuery(parameters)
{
  return Object.entries(parameters).map(([key, value]) => `${key}=${encodeURIComponent(value)}`).join("&");
}

function guestNamePreview(fileName, rule)
{
  const upper = fileName.toUpperCase();
  if (rule === "prodos")
  {
    return /^[A-Z][A-Z0-9.]{0,14}$/.test(upper) ? upper : null;
  }
  if (rule === "pascal")
  {
    return upper.length >= 1 && upper.length <= 15 && /^[\x21-\x7e]+$/.test(upper) && !/[$=?,[#:\/]/.test(upper) ? upper : null;
  }
  if (rule === "dos33")
  {
    return upper.length >= 1 && upper.length <= 30 && /^[\x20-\x5f]+$/.test(upper) && !upper.includes(",") ? upper : null;
  }
  const dot = upper.indexOf(".");
  const base = dot < 0 ? upper : upper.slice(0, dot);
  const extension = dot < 0 ? "" : upper.slice(dot + 1);
  if (upper.length === 0 || upper.length > 12 || base.length < 1 || base.length > 8 || extension.length > 3 ||
      !/^[A-Z0-9_$-]*$/.test(base + extension))
  {
    return null;
  }
  return extension ? `${base}.${extension}` : base;
}

function guestRule(slot)
{
  return guestSlots[slot].info ? guestSlots[slot].info.nameRule : "cpm";
}

function guestRuleHelp(rule)
{
  return {
    prodos: "1-15 characters, a letter first, then letters, digits or dots",
    pascal: "1-15 printable characters without space or any of $ = ? , [ # : /",
    dos33: "1-30 characters from space to underscore, no comma"
  }[rule] || "1-8 characters, optional .1-3; letters, digits, _ $ -";
}

function formatBytes(bytes)
{
  return bytes >= 1048576 ? `${(bytes / 1048576).toFixed(1)} MiB` : bytes >= 1024 ? `${(bytes / 1024).toFixed(1)} KiB` : `${bytes} bytes`;
}

function guestPicker(slot, title, options)
{
  const machineChoices = guestMachineIds.map((id) =>
    `<option value="${id}">${escapeHtml(machines.find((item) => item[0] === id)[1])}</option>`).join("");
  const userChoices = (options.allUsers ? `<option value="all">All user areas</option>` : "") +
    Array.from({length: 16}, (unused, user) => `<option value="${user}">User ${user}</option>`).join("");
  return `<section class="card">
    <h3>${escapeHtml(title)}</h3>
    <div class="row">
      <label class="field">OS directory
        <select id="${slot}Machine">${machineChoices}</select>
      </label>
      <label class="field">Disk image
        <select id="${slot}Image"><option value="">Select an image</option></select>
      </label>
      <label class="field">${options.allUsers ? "Show user area" : "User area"}
        <select id="${slot}User">${userChoices}</select>
      </label>
      <button type="button" data-guest-refresh="${slot}">Refresh</button>
    </div>
    <p id="${slot}Info" class="muted">Select an image.</p>
    ${options.selectable ? `<div class="actions">
      <button type="button" data-guest-choose="${slot}" data-guest-title="${escapeHtml(title)}">Choose files...</button>
      <span id="${slot}Selection" class="muted">No files selected.</span>
    </div>` : `<details class="fileList">
      <summary id="${slot}Summary">Files already in this image</summary>
      <div class="fileListScroll">
        <table>
          <thead><tr><th>Name</th><th>Type</th><th>User</th><th>Bytes</th><th>Flags</th><th></th></tr></thead>
          <tbody id="${slot}Table"></tbody>
        </table>
      </div>
    </details>`}
  </section>`;
}

function guestEntryIsSelectable(entry)
{
  return !entry.damaged && !entry.directory;
}

function guestVisibleIndexes(slot)
{
  const filter = element(`${slot}User`).value;
  const indexes = [];
  guestSlots[slot].files.forEach((entry, index) =>
  {
    if (filter === "all" || Number(filter) === entry.user)
    {
      indexes.push(index);
    }
  });
  return indexes;
}

function guestFlagsText(entry)
{
  return [entry.readOnly ? "R/O" : "", entry.system ? "SYS" : "", entry.directory ? "DIRECTORY (not accessible)" : "",
    entry.damaged ? "DAMAGED (cannot be read)" : ""].filter(Boolean).join(" ");
}

function renderGuestTable(slot)
{
  const body = element(`${slot}Table`);
  if (!body)
  {
    updateGuestSelectionSummary(slot);
    return;
  }
  body.replaceChildren();
  const visibleIndexes = guestVisibleIndexes(slot);
  element(`${slot}Summary`).textContent = guestSlots[slot].image ?
    `Files already in this image (${visibleIndexes.length}) - click to show` : "Files already in this image";
  for (const index of visibleIndexes)
  {
    const entry = guestSlots[slot].files[index];
    const row = document.createElement("tr");
    for (const text of [entry.name, entry.type || "", String(entry.user), String(entry.size), guestFlagsText(entry)])
    {
      const cell = document.createElement("td");
      cell.textContent = text;
      row.append(cell);
    }
    const readCell = document.createElement("td");
    if (guestEntryIsSelectable(entry) && isTextName(entry.name))
    {
      readCell.append(readButton(guestFileDownloadUrl(guestSlots[slot].image, entry), entry.name, entry.size));
    }
    row.append(readCell);
    body.append(row);
  }
}

function guestSelectedIndexes(slot)
{
  const files = guestSlots[slot].files;
  return guestVisibleIndexes(slot).filter((index) => guestSlots[slot].selected.has(index) && guestEntryIsSelectable(files[index]));
}

function updateGuestSelectionSummary(slot)
{
  const label = element(`${slot}Selection`);
  if (!label)
  {
    return;
  }
  const count = guestSelectedIndexes(slot).length;
  label.textContent = count === 0 ? "No files selected." : `${count} file(s) selected.`;
}

function guestSelectedFiles(slot)
{
  return guestSelectedIndexes(slot).map((index) => guestSlots[slot].files[index]);
}

async function loadGuestListing(slot)
{
  const slotState = guestSlots[slot];
  const image = element(`${slot}Image`).value;
  const info = element(`${slot}Info`);
  slotState.image = image;
  slotState.info = null;
  slotState.files = [];
  slotState.selected.clear();
  renderGuestTable(slot);
  if (!image)
  {
    info.textContent = "Select an image.";
    return;
  }
  info.textContent = "Reading the image directory...";
  try
  {
    const response = await api(`/api/guest/files?${guestQuery({image})}`);
    const data = await response.json();
    slotState.info = data;
    slotState.files = data.files;
    info.textContent = `${data.fs} (${data.profile}): ${data.files.length} file(s); free ${formatBytes(data.freeBytes)} in ` +
      `${data.freeBlocks} block(s) of ${data.blockSize} bytes; ${data.freeDirectoryEntries} of ${data.directoryEntries} directory entries free.`;
    const userSelect = element(`${slot}User`);
    userSelect.closest("label").hidden = data.maxUser === 0;
    if (data.maxUser === 0)
    {
      userSelect.value = userSelect.querySelector('option[value="all"]') ? "all" : "0";
    }
    renderGuestTable(slot);
  }
  catch (error)
  {
    info.textContent = error.message || "Could not read the image.";
  }
  if (typeof refreshGuestUploadPreview === "function")
  {
    refreshGuestUploadPreview();
  }
}

async function loadGuestImages(slot)
{
  const machine = element(`${slot}Machine`).value;
  const select = element(`${slot}Image`);
  select.replaceChildren(new Option("Select an image", ""));
  try
  {
    const entries = await listPath("images", machine);
    for (const entry of entries.filter((item) => !item.directory && guestImagePattern.test(item.name)))
    {
      select.add(new Option(`${entry.name} (${entry.size} bytes)`, imagePath(machine, entry.name)));
    }
  }
  catch (error)
  {
    showStatus(error.message);
  }
  await loadGuestListing(slot);
}

function guestFileDownloadUrl(image, entry)
{
  return `/api/guest/file?${guestQuery({image, user: entry.user, name: entry.name})}`;
}

}

function guestUploadPlan()
{
  const files = guestUploadPending;
  const existing = new Set(guestSlots.guestB.files.filter((entry) => entry.user === Number(element("guestBUser").value))
    .map((entry) => entry.name));
  const overwrite = element("guestUploadOverwrite").checked;
  const seen = new Set();
  return files.map((file) =>
  {
    const guestName = guestNamePreview(file.name, guestRule("guestB"));
    let result = "OK";
    let accepted = true;
    if (!guestName)
    {
      result = `Invalid name (${guestRuleHelp(guestRule("guestB"))})`;
      accepted = false;
    }
    else if (file.size === 0)
    {
      result = "Empty files cannot be stored";
      accepted = false;
    }
    else if (seen.has(guestName))
    {
      result = "Duplicate guest name in this selection";
      accepted = false;
    }
    else if (existing.has(guestName))
    {
      result = overwrite ? "Exists: will be OVERWRITTEN" : "Exists: will be skipped";
      accepted = overwrite;
    }
    if (guestName)
    {
      seen.add(guestName);
    }
    return {file, guestName, result, accepted};
  });
}

function refreshGuestUploadPreview()
{
  const body = element("guestUploadPreview");

  {
    return;
  }
  body.replaceChildren();
  const plan = guestUploadPlan();
  plan.forEach((item, index) =>
  {
    const row = document.createElement("tr");
    for (const text of [item.file.name, item.guestName || "-", String(item.file.size), item.result])
    {

      cell.textContent = text;
      row.append(cell);
    }
    const removeCell = document.createElement("td");
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "Remove";
    remove.dataset.pendingRemove = "guest";
    remove.dataset.index = String(index);
    removeCell.append(remove);
    row.append(removeCell);
    body.append(row);
  });
  const todo = plan.filter((item) => item.accepted);
  const total = todo.reduce((sum, item) => sum + item.file.size, 0);
  const free = guestSlots.guestB.info ? guestSlots.guestB.info.freeBytes : null;
  const image = element("guestBImage").value;
  const userSelect = element("guestBUser");
  element("guestUploadHeader").textContent = image ?

    "Destination: no disk image selected yet.";
  element("guestUploadTotals").textContent = plan.length === 0 ? "No files in the list." :
    `${plan.length} file(s): ${todo.length} will be stored (${formatBytes(total)}), ${plan.length - todo.length} skipped or rejected` +
    (free === null ? "." : `; free in image: ${formatBytes(free)}${total > free ? " — NOT ENOUGH SPACE" : ""}.`);
  element("guestUploadButton").disabled = guestUploadBusy || (plan.length > 0 && todo.length === 0) ||
    (free !== null && total > free);
}

function transferGuestUpload(url, file, label)
{
  const request = new XMLHttpRequest();
  request.open("POST", url);
  request.setRequestHeader("Content-Type", "application/octet-stream");
  request.upload.onprogress = (event) =>
  {
    showProgress(label, event.loaded, event.lengthComputable ? event.total : file.size);
  };
  return new Promise((resolve, reject) =>
  {
    request.onload = () =>
    {
      if (request.status >= 200 && request.status < 300)
      {
        resolve(request.responseText);
      }
      else
      {
        reject(new Error(request.responseText || `Upload failed (${request.status}).`));
      }
    };
    request.onerror = () => reject(new Error("Connection lost. Check the USB terminal."));
    request.onabort = () => reject(new Error("Transfer cancelled."));
    request.send(file);
  });
}

async function submitGuestUpload()
{
  const image = element("guestBImage").value;
  if (!image)
  {
    throw new Error("Select a destination disk image first.");
  }
  const user = element("guestBUser").value;
  const overwrite = element("guestUploadOverwrite").checked;
  const typeText = element("guestUploadType").value.trim();
  const auxText = element("guestUploadAux").value.trim();
  if (!/^([0-9a-f]{1,2})?$/i.test(typeText) || !/^([0-9a-f]{1,4})?$/i.test(auxText))
  {
    throw new Error("The Apple file type must be 1-2 hex digits and the aux type 1-4 hex digits.");
  }
  const plan = guestUploadPlan();
  if (plan.length === 0)
  {
    throw new Error("Choose one or more Computer files first.");
  }
  const todo = plan.filter((item) => item.accepted);
  if (todo.length === 0)
  {
    throw new Error("Nothing can be stored: " + plan.map((item) => `${item.file.name}: ${item.result}`).join("; "));
  }
  const replaced = todo.filter((item) => item.result.startsWith("Exists"));
  if (replaced.length > 0 &&
      !confirm(`OVERWRITE ${replaced.map((item) => item.guestName).join(", ")} in ${image} (user ${user})? Overwriting needs free room for both copies while it runs.`))
  {
    return;
  }
  guestUploadBusy = true;
  element("guestUploadButton").disabled = true;
  const lines = plan.filter((item) => !item.accepted).map((item) => `${item.file.name}: skipped (${item.result})`);
  const stored = new Set();
  try
  {
    for (const item of todo)
    {
      const parameters = {image, user, name: item.guestName, overwrite: overwrite ? "1" : "0"};
      if (typeText)
      {
        parameters.ptype = typeText;
      }
      if (auxText)
      {
        parameters.aux = auxText;
      }
      const url = `/api/guest/upload?${guestQuery(parameters)}`;
      try
      {
        await transferGuestUpload(url, item.file, `Storing ${item.guestName}`);
        stored.add(item.file);
        lines.push(`${item.file.name} -> ${item.guestName}: stored`);
      }
      catch (error)
      {
        lines.push(`${item.file.name}: FAILED - ${error.message}`);
      }
      showStatus(lines.join("\n"));
    }
  }
  finally
  {
    guestUploadBusy = false;
    guestUploadPending = guestUploadPending.filter((file) => !stored.has(file));
    hideProgress();
  }
  showStatus(lines.join("\n"));
  await loadGuestListing("guestB");
  refreshGuestUploadPreview();
}

let crc32Table = null;

function crc32(bytes)
{
  if (crc32Table === null)
  {
    crc32Table = new Uint32Array(256);
    for (let index = 0; index < 256; index++)
    {
      let value = index;
      for (let bit = 0; bit < 8; bit++)
      {
        value = (value & 1) ? (0xEDB88320 ^ (value >>> 1)) : (value >>> 1);
      }
      crc32Table[index] = value >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for (let index = 0; index < bytes.length; index++)
  {
    crc = crc32Table[(crc ^ bytes[index]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function buildZipBlob(entries)
{
  const encoder = new TextEncoder();
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = (Math.max(now.getFullYear() - 1980, 0) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [];
  const central = [];
  let offset = 0;
  for (const entry of entries)
  {
    const nameBytes = encoder.encode(entry.name);
    const crc = crc32(entry.data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034B50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);
    local.setUint16(8, 0, true);
    local.setUint16(10, dosTime, true);
    local.setUint16(12, dosDate, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, entry.data.length, true);
    local.setUint32(22, entry.data.length, true);
    local.setUint16(26, nameBytes.length, true);
    local.setUint16(28, 0, true);
    parts.push(local, nameBytes, entry.data);
    const header = new DataView(new ArrayBuffer(46));
    header.setUint32(0, 0x02014B50, true);
    header.setUint16(4, 20, true);
    header.setUint16(6, 20, true);
    header.setUint16(8, 0x0800, true);
    header.setUint16(10, 0, true);
    header.setUint16(12, dosTime, true);
    header.setUint16(14, dosDate, true);
    header.setUint32(16, crc, true);
    header.setUint32(20, entry.data.length, true);
    header.setUint32(24, entry.data.length, true);
    header.setUint16(28, nameBytes.length, true);
    header.setUint32(42, offset, true);
    central.push(header, nameBytes);
    offset += 30 + nameBytes.length + entry.data.length;
  }
  let centralSize = 0;
  for (const piece of central)
  {
    centralSize += piece.byteLength;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054B50, true);
  end.setUint16(8, entries.length, true);
  end.setUint16(10, entries.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], {type: "application/zip"});
}

async function downloadGuestFilesAsZip(image, selected)
{
  const entries = [];
  const lines = [];
  const usedNames = new Set();
  const multipleUsers = new Set(selected.map((entry) => entry.user)).size > 1;
  for (const entry of selected)
  {
    try
    {
      showStatus(`Reading ${entry.name} (${entries.length + 1} of ${selected.length})...`);
      const response = await api(guestFileDownloadUrl(image, entry));
      const data = new Uint8Array(await response.arrayBuffer());
      const safeName = entry.name.replace(/[\\/:*?"<>|]/g, "_");
      let zipName = multipleUsers ? `user${entry.user}/${safeName}` : safeName;
      if (usedNames.has(zipName.toLowerCase()))
      {
        zipName = `${zipName}_${entries.length + 1}`;
      }
      usedNames.add(zipName.toLowerCase());
      entries.push({name: zipName, data});
      lines.push(`${entry.name}: added to the ZIP`);
    }
    catch (error)
    {
      lines.push(`${entry.name}: FAILED - ${error.message}`);
    }
  }
  if (entries.length === 0)
  {
    showStatus(lines.join("\n"));
    return;
  }
  const imageName = image.split("/").pop().replace(/\.[^.]*$/, "");
  const zipFileName = `${imageName || "guestFiles"}.zip`;
  const link = document.createElement("a");
  link.href = URL.createObjectURL(buildZipBlob(entries));
  link.download = zipFileName;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 60000);
  lines.push(`${zipFileName}: ${entries.length} file(s) downloaded as one ZIP file.`);
  showStatus(lines.join("\n"));
}

async function downloadGuestFiles()
{
  const image = element("guestAImage").value;
  const selected = guestSelectedFiles("guestA");
  if (!image || selected.length === 0)
  {
    throw new Error("Select an image and at least one file.");
  }
  if (selected.length === 1)
  {
    await downloadToComputer(guestFileDownloadUrl(image, selected[0]), selected[0].name);
    return;
  }
  if (element("guestDownloadZip").checked)
  {
    await downloadGuestFilesAsZip(image, selected);
    return;
  }
  const lines = [];
  for (const entry of selected)
  {
    try
    {
      const response = await api(guestFileDownloadUrl(image, entry));
      const link = document.createElement("a");
      link.href = URL.createObjectURL(await response.blob());
      link.download = entry.name;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
      lines.push(`${entry.name}: downloaded`);
    }
    catch (error)
    {
      lines.push(`${entry.name}: FAILED - ${error.message}`);
    }
    showStatus(lines.join("\n"));
  }
}

async function copyGuestFiles()
{
  const source = element("guestAImage").value;
  const destination = element("guestBImage").value;
  const destinationUser = Number(element("guestBUser").value);
  const selected = guestSelectedFiles("guestA");
  if (!source || !destination || selected.length === 0)
  {
    throw new Error("Select a source image, a destination image and at least one source file.");
  }
  const overwrite = element("guestCopyOverwrite").checked;
  const existing = new Set(guestSlots.guestB.files.filter((entry) => entry.user === destinationUser).map((entry) => entry.name));
  const todo = [];
  const lines = [];
  for (const entry of selected)
  {
    if (source.toLowerCase() === destination.toLowerCase() && entry.user === destinationUser)
    {
      lines.push(`${entry.name}: skipped (source and destination are the same file)`);
    }
    else if (existing.has(entry.name) && !overwrite)
    {
      lines.push(`${entry.name}: skipped (exists; enable OVERWRITE)`);
    }
    else
    {
      todo.push(entry);
    }
  }
  const replaced = todo.filter((entry) => existing.has(entry.name));
  if (todo.length === 0)
  {
    showStatus(lines.join("\n"));
    return;
  }
  if (replaced.length > 0 &&
      !confirm(`OVERWRITE ${replaced.map((entry) => entry.name).join(", ")} in ${destination} (user ${destinationUser})?`))
  {
    return;
  }
  for (const entry of todo)
  {
    try
    {
      const query = guestQuery({fromImage: source, fromUser: entry.user, fromName: entry.name, toImage: destination,
        toUser: destinationUser, overwrite: overwrite ? "1" : "0"});
      await api(`/api/guest/copy?${query}`, {method: "POST"});
      lines.push(`${entry.name}: copied`);
    }
    catch (error)
    {
      lines.push(`${entry.name}: FAILED - ${error.message}`);
    }
    showStatus(lines.join("\n"));
  }
  await loadGuestListing("guestB");
  if (source.toLowerCase() === destination.toLowerCase())
  {
    await loadGuestListing("guestA");
  }
}

function openSelectPopup(select)
{
  if (select.disabled || select.options.length === 0)
  {
    return;
  }
  const label = select.closest("label");
  const title = label ? Array.from(label.childNodes).filter((node) => node.nodeType === Node.TEXT_NODE)
    .map((node) => node.textContent.trim()).join(" ").trim() : "";
  element("selectDialogTitle").textContent = title || "Select";
  selectDialogList.replaceChildren();
  if (Array.from(select.options).every((option) => option.value === ""))
  {
    const note = document.createElement("p");
    note.className = "muted";
    note.textContent = "Nothing to choose: no items were found for the current selection.";
    selectDialogList.append(note);
  }
  Array.from(select.options).forEach((option, index) =>
  {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = option.textContent;
    button.disabled = option.disabled;
    button.dataset.optionIndex = String(index);
    button.setAttribute("role", "option");
    button.setAttribute("aria-selected", index === select.selectedIndex ? "true" : "false");
    selectDialogList.append(button);
  });
  selectDialogTarget = select;
  selectDialog.showModal();
  const current = selectDialogList.querySelector('[aria-selected="true"]');
  if (current)
  {
    current.scrollIntoView({block: "center"});
  }
}

selectDialogList.addEventListener("click", (event) =>
{
  const button = event.target.closest("button[data-option-index]");
  if (!button || !selectDialogTarget)
  {
    return;
  }
  const select = selectDialogTarget;
  const index = Number(button.dataset.optionIndex);
  selectDialogTarget = null;
  selectDialog.close();
  if (select.selectedIndex !== index)
  {
    select.selectedIndex = index;
    select.dispatchEvent(new Event("change", {bubbles: true}));
  }
  select.focus();
});
selectDialog.addEventListener("click", (event) =>
{
  if (event.target === selectDialog)
  {
    selectDialog.close();
  }
});
selectDialog.addEventListener("close", () =>
{
  selectDialogTarget = null;
});
const guestFilesDialog = element("guestFilesDialog");
const guestFilesBody = element("guestFilesBody");
let guestFilesSlot = null;

function renderGuestFilesPopup()
{
  const slot = guestFilesSlot;
  const files = guestSlots[slot].files;
  const indexes = guestVisibleIndexes(slot);
  guestFilesBody.replaceChildren();
  for (const index of indexes)
  {
    const entry = files[index];
    const row = document.createElement("tr");
    const boxCell = document.createElement("td");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.dataset.guestIndex = String(index);
    box.disabled = !guestEntryIsSelectable(entry);
    box.checked = !box.disabled && guestSlots[slot].selected.has(index);
    boxCell.append(box);
    row.append(boxCell);
    for (const text of [entry.name, entry.type || "", String(entry.user), String(entry.size), guestFlagsText(entry)])
    {
      const cell = document.createElement("td");
      cell.textContent = text;
      row.append(cell);
    }
    const readCell = document.createElement("td");
    if (guestEntryIsSelectable(entry) && isTextName(entry.name))
    {
      readCell.append(readButton(guestFileDownloadUrl(guestSlots[slot].image, entry), entry.name, entry.size));
    }
    row.append(readCell);
    guestFilesBody.append(row);
  }
  if (indexes.length === 0)
  {
    const row = document.createElement("tr");
    const cell = document.createElement("td");
    cell.colSpan = 7;
    cell.textContent = guestSlots[slot].image ? "No files in this user area." : "Select an image first.";
    row.append(cell);
    guestFilesBody.append(row);
  }
  element("guestFilesCount").textContent = `${guestSelectedIndexes(slot).length} of ${indexes.filter((index) =>
    guestEntryIsSelectable(files[index])).length} file(s) selected.`;
  element("guestFilesSelectAll").disabled = !indexes.some((index) => guestEntryIsSelectable(files[index]));
}

function openGuestFilesPopup(slot, title)
{
  guestFilesSlot = slot;
  element("guestFilesTitle").textContent = title || "Select files";
  renderGuestFilesPopup();
  guestFilesDialog.showModal();
}

function toggleGuestSelectAll()
{
  const slot = guestFilesSlot;
  const files = guestSlots[slot].files;
  const indexes = guestVisibleIndexes(slot).filter((index) => guestEntryIsSelectable(files[index]));
  const everySelected = indexes.length > 0 && indexes.every((index) => guestSlots[slot].selected.has(index));
  for (const index of indexes)
  {
    if (everySelected)
    {
      guestSlots[slot].selected.delete(index);
    }
    else
    {
      guestSlots[slot].selected.add(index);
    }
  }
  renderGuestFilesPopup();
}

element("guestFilesSelectAll").addEventListener("click", toggleGuestSelectAll);
guestFilesBody.addEventListener("click", (event) =>
{
  if (event.target.closest("button"))
  {
    return;
  }
  const row = event.target.closest("tr");
  const box = row ? row.querySelector("input[data-guest-index]") : null;
  if (!box || box.disabled)
  {
    return;
  }
  if (event.target !== box)
  {
    box.checked = !box.checked;
  }
  const selected = guestSlots[guestFilesSlot].selected;
  if (box.checked)
  {
    selected.add(Number(box.dataset.guestIndex));
  }
  else
  {
    selected.delete(Number(box.dataset.guestIndex));
  }
  renderGuestFilesPopup();
});
guestFilesDialog.addEventListener("click", (event) =>
{
  if (event.target === guestFilesDialog)
  {
    guestFilesDialog.close();
  }
});
guestFilesDialog.addEventListener("close", () =>
{
  const slot = guestFilesSlot;
  guestFilesSlot = null;
  if (slot)
  {
    updateGuestSelectionSummary(slot);
  }
});
element("app").addEventListener("mousedown", (event) =>
{
  if (event.target.closest("select"))
  {
    event.preventDefault();
  }
});
element("app").addEventListener("click", (event) =>
{
  const select = event.target.closest("select");
  if (select)
  {
    openSelectPopup(select);
  }
});
element("app").addEventListener("keydown", (event) =>
{
  if (event.target.tagName === "SELECT" && [" ", "Enter", "ArrowDown", "ArrowUp"].includes(event.key))
  {
    event.preventDefault();
    openSelectPopup(event.target);
  }
});
menuBar.addEventListener("click", (event) =>
{
  const button = event.target.closest("button");
  if (!button)
  {
    return;
  }
  if (button.dataset.menu !== undefined)
  {
    const wasOpen = button.classList.contains("open");
    closeMenus();
    if (!wasOpen)
    {
      button.classList.add("open");
      button.nextElementSibling.hidden = false;
    }
    return;
  }
  closeMenus();
  if (button.id === "helpButton")
  {
    showHelp();
  }
  else if (button.id === "homeButton")
  {
    navigate("home", null);
  }
  else if (button.dataset.openFunction)
  {
    navigate("function", button.dataset.openFunction);
  }
});
menuBar.addEventListener("mouseover", (event) =>
{
  const button = event.target.closest("[data-menu]");
  if (button && !button.classList.contains("open") && menuBar.querySelector(".menuButton.open"))
  {
    closeMenus();
    button.classList.add("open");
    button.nextElementSibling.hidden = false;
  }
});
document.addEventListener("click", (event) =>
{
  if (!menuBar.contains(event.target))
  {
    closeMenus();
  }
});
document.addEventListener("keydown", (event) =>
{
  if (event.key === "Escape")
  {
    closeMenus();
  }
});
element("computerFolderInput").addEventListener("change", (event) =>
{
  const files = Array.from(event.target.files);
  const machine = element("uploadMachine").value;
  const rootFiles = files.filter((file) =>
    !file.webkitRelativePath || file.webkitRelativePath.split("/").length === 2);
  const images = supportedImageFiles(rootFiles);
  const relativePath = files.find((file) => file.webkitRelativePath)?.webkitRelativePath || "";
  const folderName = relativePath.split("/")[0] || "Selected folder";
  hostFiles.set(machine, images);
  hostDirectoryNames.set(hostDirectoryKey("upload", machine),
    `${folderName}: ${images.length} supported disk image(s) selected.`);
  updateHostFolderLabel(machine);
  refreshImageUploadPreview();
  if (files.length !== images.length)
  {
    showStatus(`${files.length - images.length} nested or non-image file(s) in the selected Computer folder will be ignored.`);
  }
});
element("app").addEventListener("click", (event) =>
{
  const openFunction = event.target.closest("[data-open-function]");
  if (openFunction)
  {
    navigate("function", openFunction.dataset.openFunction);
  }
});
element("app").addEventListener("change", (event) =>
{
  const id = event.target.id;
  const guestMatch = /^(guest[AB])(Machine|Image|User)$/.exec(id);
  if (guestMatch)
  {
    const [, slot, part] = guestMatch;
    if (part === "Machine")
    {
      run(() => loadGuestImages(slot));
    }
    else if (part === "Image")
    {
      run(() => loadGuestListing(slot));
    }
    else
    {
      renderGuestTable(slot);
      refreshGuestUploadPreview();
    }
  }
  if (id === "guestUploadFiles")
  {
    guestUploadPending = mergeFiles(guestUploadPending, Array.from(event.target.files));
    event.target.value = "";
    refreshGuestUploadPreview();
  }
  if (id === "guestUploadOverwrite")
  {
    refreshGuestUploadPreview();
  }
  if (id === "overwrite")
  {
    refreshImageUploadPreview();
  }
  if (id === "sdSourceMachine")
  {
    run(loadSdFiles);
  }
  if (id === "downloadMachine")
  {
    run(() => loadImageOptions("download"));
  }
  if (id === "copySourceMachine")
  {
    run(() => loadImageOptions("copySource"));
  }
  if (id === "uploadMachine")
  {
    element("uploadMachineLabel").textContent = event.target.value;
    element("configTargetLabel").textContent = event.target.value;
    updateHostFolderLabel(event.target.value);
    refreshImageUploadPreview();
  }
  if (id === "uploadKind")
  {
    const configuration = event.target.value === "drivesCfg";
    element("uploadImageSection").hidden = configuration;
    element("uploadConfigSection").hidden = !configuration;
  }
  if (id === "downloadMachine")
  {
    element("downloadMachineLabel").textContent = event.target.value;
  }
  if (id === "managerMachine")
  {
    run(refreshManager);
  }
  if (id === "imageFiles")
  {
    const files = Array.from(event.target.files);
    const machine = element("uploadMachine").value;
    hostFiles.set(machine, mergeFiles(hostFiles.get(machine) || [], files));
    hostDirectoryNames.delete(hostDirectoryKey("upload", machine));
    event.target.value = "";
    updateHostFolderLabel(machine);
    refreshImageUploadPreview();
  }
});
element("app").addEventListener("click", (event) =>
{
  const refresh = event.target.closest("[data-guest-refresh]");
  if (refresh)
  {
    run(() => loadGuestImages(refresh.dataset.guestRefresh));
  }
  const choose = event.target.closest("[data-guest-choose]");
  if (choose)
  {
    openGuestFilesPopup(choose.dataset.guestChoose, choose.dataset.guestTitle);
  }
  if (event.target.id === "guestDownloadButton")
  {
    run(downloadGuestFiles);
  }
  if (event.target.id === "guestImageCopyButton")
  {
    run(copyGuestFiles);
  }
  if (event.target.id === "sdToGuestButton")
  {
    run(copySdFileToGuest);
  }
  if (event.target.id === "guestToSdButton")
  {
    run(copyGuestFilesToSd);
  }
  if (event.target.id === "guestRenameButton")
  {
    run(renameGuestFile);
  }
  if (event.target.id === "guestDeleteButton")
  {
    run(deleteGuestFiles);
  }
  if (event.target.id === "managerRefresh")
  {
    run(refreshManager);
  }
  const pendingRemove = event.target.closest("[data-pending-remove]");
  if (pendingRemove)
  {
    const index = Number(pendingRemove.dataset.index);
    if (pendingRemove.dataset.pendingRemove === "images")
    {
      const machine = element("uploadMachine").value;
      hostFiles.set(machine, (hostFiles.get(machine) || []).filter((file, position) => position !== index));
      hostDirectoryNames.delete(hostDirectoryKey("upload", machine));
      updateHostFolderLabel(machine);
      refreshImageUploadPreview();
    }
    else
    {
      guestUploadPending = guestUploadPending.filter((file, position) => position !== index);
      refreshGuestUploadPreview();
    }
  }
  if (event.target.id === "imageUploadClear")
  {
    const machine = element("uploadMachine").value;
    hostFiles.delete(machine);
    hostDirectoryNames.delete(hostDirectoryKey("upload", machine));
    updateHostFolderLabel(machine);
    refreshImageUploadPreview();
  }
  if (event.target.id === "guestUploadClear")
  {
    guestUploadPending = [];
    refreshGuestUploadPreview();
  }
  if (event.target.id === "chooseUploadFolder")
  {
    run(selectHostDirectory);
  }
  if (event.target.id === "reuseUploadFolder")
  {
    run(reuseHostDirectory);
  }
  if (event.target.id === "downloadImageButton")
  {
    const path = element("downloadImage").value;
    if (!path)
    {
      showStatus("Select a whole disk image first.");
      return;
    }
    const name = path.split("/").pop();
    run(() => downloadImageToComputer(path, name));
  }
  if (event.target.id === "copyImageButton")
  {
    run(async () =>
    {
      const source = element("copySourceImage").value;
      const destinationName = element("copyDestinationName").value.trim();
      if (!source || !destinationName || destinationName.includes("/") ||
          !/\.(dsk|img|po|woz|2mg)$/i.test(destinationName))
      {
        throw new Error("Select a source image and enter a new disk-image filename without a directory.");
      }
      const destination = imagePath(element("copyDestinationMachine").value, destinationName);
      const overwrite = element("copyOverwrite").checked;
      if (overwrite && !confirm(`Replace ${destination}? It may be mapped in drives.cfg, including as RO. The mapping will not be changed; the existing image is preserved during commit.`))
      {
        return;
      }
      if (!confirm(`Copy complete image ${source} to ${destination}? The source remains unchanged.`))
      {
        return;
      }
      showStatus("Copying whole disk image and verifying bytes...");
      const response = await api(`/api/images/copy${imageOperationQuery(source, destination)}`,
        {method: "POST", headers: overwrite ? {"X-Overwrite": "1"} : {}});
      showStatus(await response.text());
    });
  }
  if (event.target.id === "restoreBackup")
  {
    run(async () =>
    {
      const destination = prompt("Enter the intended destination relative to /retro/images/ (example cpm80/work.dsk):");
      if (!destination || !confirm(`Restore the preserved backup to ${destination}? Destination must not exist. If mapped, drives.cfg will not be changed.`))
      {
        return;
      }
      const response = await api(`/api/images/recover?destination=${encodeURIComponent(destination)}`,
        {method: "POST"});
      showStatus(await response.text());
      await refreshManager();
    });
  }
});
element("app").addEventListener("submit", (event) =>
{
  if (event.target.id === "guestUploadForm")
  {
    event.preventDefault();
    run(submitGuestUpload);
  }
  if (event.target.id === "configUploadForm")
  {
    event.preventDefault();
    run(async () =>
    {
      const machine = element("uploadMachine").value;
      const files = Array.from(element("configFile").files);
      if (files.length !== 1)
      {
        throw new Error("Select exactly one drives.cfg file on the Computer.");
      }
      const file = files[0];
      if (file.size === 0 || file.size > 16384)
      {
        throw new Error("drives.cfg must be between 1 and 16384 bytes.");
      }
      if (!confirm(`Replace /retro/images/${machine}/drives.cfg with ${file.name} (${file.size} bytes)? The existing drive configuration is replaced; the emulator reads the new one at its next start.`))
      {
        return;
      }
      element("configUploadButton").disabled = true;
      try
      {
        await transferUpload("images", imagePath(machine, "drives.cfg"), file, true, "Uploading drives.cfg");
        element("configFile").value = "";
        showStatus(`Copied ${file.name} to /retro/images/${machine}/drives.cfg.`);
      }
      finally
      {
        element("configUploadButton").disabled = false;
        hideProgress();
      }
    });
  }
  if (event.target.id === "imageUploadForm")
  {
    event.preventDefault();
    run(submitImageUpload);
  }
});
window.addEventListener("dragover", (event) =>
{
  if (!dragHasFiles(event))
  {
    return;
  }
  event.preventDefault();
  const zone = event.target instanceof Element ? event.target.closest("[data-dropzone]") : null;
  event.dataTransfer.dropEffect = zone ? "copy" : "none";
  if (zone)
  {
    zone.classList.add("dragActive");
  }
});
window.addEventListener("dragleave", (event) =>
{
  const zone = event.target instanceof Element ? event.target.closest("[data-dropzone]") : null;
  if (zone)
  {
    zone.classList.remove("dragActive");
  }
});
window.addEventListener("drop", (event) =>
{
  if (!dragHasFiles(event))
  {
    return;
  }
  event.preventDefault();
  document.querySelectorAll(".dragActive").forEach((zone) => zone.classList.remove("dragActive"));
  const zone = event.target instanceof Element ? event.target.closest("[data-dropzone]") : null;
  if (!zone)
  {
    showStatus("Drop the files on the marked drop zone.");
    return;
  }
  const collecting = collectDroppedFiles(event.dataTransfer);
  run(async () => applyDroppedFiles(zone.dataset.dropzone, await collecting));
});
window.addEventListener("popstate", (event) =>
{
  const destination = event.state || {screen: "home", functionId: null};
  state.screen = destination.screen;
  state.functionId = destination.functionId;
  render();
});
window.addEventListener("error", (event) =>
{
  showStatus(event.message || "A browser error interrupted the operation.");
});
history.replaceState({screen: "home", functionId: null}, "", "#home");
render();
</script>
