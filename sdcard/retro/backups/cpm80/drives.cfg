# CP/M-80 drives: <letter>=<image>,<RO|RW>,<size identifier>
#   letter  A..F  (A: is the LittleFS system image; B: to F: are SD images)
#   mode    RO or RW
#   size    CPM80_256K (256256 bytes), CPM80_512K (512512 bytes),
#           CPM80_1440K (1474560 bytes) or CPM80_8M (8421376 bytes);
#           the identifier must match the image file
#   image   A: below /littlefs/cpm80/, B: to F: below /retro/images/cpm80/
#
# A: is never CPM80_8M; make the images with tools/diskManager.py
# --type WORKDSK (--os cpm80 --profile <size identifier>).
A=/littlefs/cpm80/system.dsk,RO,CPM80_1440K
B=/retro/images/cpm80/work1.dsk,RW,CPM80_512K
C=/retro/images/cpm80/work2.dsk,RW,CPM80_8M
D=/retro/images/cpm80/languages.dsk,RW,CPM80_8M
E=/retro/images/cpm80/work1440.dsk,RW,CPM80_1440K
