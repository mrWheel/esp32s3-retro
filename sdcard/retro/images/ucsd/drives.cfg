# Apple II devices: SD<slot>.<drive> or SP<slot>.<unit>=<image>,<RO|RW>,<profile>
#   slot    4..7  (SD6.1 is the boot drive; there is no default drive, a drive
#                  without a line stays empty)
#   drive   1..2
#   SP      optional SmartPort block-device controller in slots 4..7, units 1..4;
#           do not combine SP<slot>.* with SD<same-slot>.*
#   mode    RO or RW (/littlefs/apple2/system.dsk must stay RO)
#   profile APPLE2_140K (143360 bytes, 35 tracks),
#           APPLE2_640K (655360 bytes, 1280 512-byte blocks) or
#           APPLE2_800K (819200 bytes, 1600 512-byte blocks; the
#           preferred size for ProDOS 8 data volumes)
#   image   below /littlefs/apple2/, /littlefs/ucsd/,
#           /retro/images/apple2/ or /retro/images/ucsd/
#
#   RAMCARD optional: RAMCARD=LC16 (default, 16 KiB Language Card) or
#           RAMCARD=SATURN128 (Saturn 128K card, 8 banks of 16 KiB in slot 0)
#   MACHINE optional: MACHINE=II (default, Apple II Plus) or MACHINE=IIE (Apple IIe with
#           128 KiB main + auxiliary memory; needs /littlefs/apple2/apple2e.rom;
#           RAMCARD is ignored on a IIe)
#
# The 140K Pascal boot disk uses Disk II. Mount Pascal system/work volumes as
# SmartPort block devices; Pascal cannot read their TEXT file blocks via Disk II.
# Pascal's ProDOS block interface exposes two units per slot, so additional
# Pascal volumes must use another slot rather than SP5.3/SP5.4.
#
MACHINE=IIE
#
#--> #4: PASCAL:
SD6.1=/littlefs/ucsd/ApplePascal1.3-800K.po,RW,APPLE2_800K
#--> #5: BACKUP:
SD6.2=/retro/images/ucsd/ApplePascal2-640K.po,RO,APPLE2_640K
#--> #9:
#SP4.1=/retro/images/ucsd/...
#--> #10:
#SP4.2=/retro/images/ucsd/...
#--> #11: WORK1:
SP5.1=/retro/images/ucsd/pascalWork1.po,RW,APPLE2_640K
#--> #12: WORK2:
SP5.2=/retro/images/ucsd/pascalWork2.po,RW,APPLE2_640K
