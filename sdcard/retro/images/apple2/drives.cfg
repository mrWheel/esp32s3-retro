# Apple II devices: PR<slot>.<drive> or SP5.<unit>=<image>,<RO|RW>,<profile>
#   slot    4..7  (Disk II controller card; its boot ROM is at $Cn00, I/O at $C080+n*16)
#   drive   1..2
#   SP5     optional SmartPort block-device controller in slot 5; do not combine SP5.* with PR5.*
#   mode    RO or RW (system.dsk must stay RO)
#   profile APPLE2_140K (143360 bytes, 35 tracks) or APPLE2_640K (655360 bytes, 160 tracks = 1280 512-byte blocks)
#   image   below /littlefs/apple2/ or /retro/images/apple2/
# The sector order comes from the extension (.po = ProDOS/Pascal, .do = DOS) or else from the content.
# PR6.1 defaults to /littlefs/apple2/system.dsk when it is not listed.
# ProDOS 8 requires a bootable ProDOS image in PR6.1 and SmartPort data images in SP5.1/SP5.2.
# Blank ProDOS block images can be made with tools/diskImageApple2Prodos.py.
# Example only; uncomment after placing authorized boot media and creating the 640K data image:
# PR6.1=/retro/images/apple2/prodos242.dsk,RO,APPLE2_140K
# SP5.2=/retro/images/apple2/prodos640.po,RW,APPLE2_640K
#
PR6.1=/littlefs/apple2/system.dsk,RO,APPLE2_140K
#
# Non-system images can be written back to their image files.
PR5.1=/retro/images/apple2/data2.dsk,RW,APPLE2_140K
PR5.2=/retro/images/apple2/pascal640.po,RW,APPLE2_640K