# Apple II devices: SD<slot>.<drive> or SP5.<unit>=<image>,<RO|RW>,<profile>
#   slot    4..7  (SD6.1 is the boot drive; there is no default drive, a drive
#                  without a line stays empty)
#   drive   1..2
#   SP5     optional SmartPort block-device controller in slot 5; do not
#           combine SP5.* with SD5.*
#   mode    RO or RW (/littlefs/apple2/system.dsk must stay RO)
#   profile APPLE2_140K (143360 bytes, 35 tracks),
#           APPLE2_640K (655360 bytes, 1280 512-byte blocks) or
#           APPLE2_800K (819200 bytes, 1600 512-byte blocks; the
#           preferred size for ProDOS 8 data volumes)
#   image   below /littlefs/apple2/ or /retro/images/apple2/
#
# Apple II uses ProDOS only. An image with ProDOS content on SD<slot>.<drive>
# turns that slot into a ProDOS block device, so both drives of such a slot
# are block devices; keep Pascal images in a slot of their own (Disk II).
# The Autostart ROM boots the highest slot with a boot device, so ProDOS
# starts at power-on, or type PR#6.
#
# SD6.1 is the ProDOS 8 system disk, volume /SYSTEM. It is built into the
# firmware by createSystemDsk.py --os apple2 --profile PRODOS (idf.py build
# does it); rebuild AND flash the firmware to use a new one. BASIC.SYSTEM
# runs STARTUP, the former HELLO program.
# The data volumes are made with tools/buildDiskImage.py --os apple2
# --name <NAME> <file>.po (800K) and uploaded to /retro/images/apple2/ on
# the SD card with "File Transfer". They are read/write:
#   SD6.2 = /DATA1 (CATALOG,S6,D2 or CAT /DATA1)
#   SD5.1 = /DATA2 (CATALOG,S5,D1 or CAT /DATA2)
SD6.1=/littlefs/apple2/system.dsk,RO,APPLE2_140K
SD6.2=/retro/images/apple2/data1.po,RW,APPLE2_800K
SD5.1=/retro/images/apple2/data2.po,RW,APPLE2_800K
#
# Apple Pascal volume in slot 4 (Disk II):
SD4.1=/retro/images/apple2/pascal640.po,RW,APPLE2_640K
