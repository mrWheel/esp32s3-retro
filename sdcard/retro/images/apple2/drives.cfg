# Apple II devices: PR<slot>.<drive> or SP5.<unit>=<image>,<RO|RW>,<profile>
#   slot    4..7  (Disk II controller card; its boot ROM is at $Cn00, 
#I/O at $C080+n*16)
#   drive   1..2
#   SP5     optional SmartPort block-device controller in slot 5; do not 
#           combine SP5.* with PR5.*
#   mode    RO or RW (system.dsk must stay RO)
#   profile APPLE2_140K (143360 bytes, 35 tracks), 
#   APPLE2_640K (655360 bytes, 160 tracks = 1280 512-byte blocks) or
#   APPLE2_800K (819200 bytes, 200 tracks = 1600 512-byte blocks; the
#   preferred size for ProDOS 8 data volumes)
#   image   below /littlefs/apple2/ or /retro/images/apple2/
# The sector order comes from the extension (.po = ProDOS/Pascal,
# .do = DOS) or else from the content.
# PR6.1 defaults to /littlefs/apple2/system.dsk when it is not listed.
# ProDOS 8: an image with ProDOS content (a .po file, or a .dsk that holds a
# ProDOS volume) on PR<slot>.<drive> turns that slot into a ProDOS block
# device (the Disk II boot ROM cannot start ProDOS). Both drives of such a
# slot are then block devices, so keep DOS 3.3 and ProDOS images in
# different slots. The Autostart ROM boots the highest slot with a boot
# device, so ProDOS starts at power-on, or type PR#6 (or PR#<slot>).
# Boot ProDOS from PR6.1: createSystemDsk.py --os apple2 --profile PRODOS
# creates a ProDOS system.dsk; rebuild AND flash the firmware to use it
# (idf.py -DAPPLE2_SYSTEM_DISK_PROFILE=PRODOS build). It is bootable
# volume /SYSTEM: BASIC.SYSTEM runs STARTUP, the former HELLO program.
# SP5.<unit> is the same block device as an explicit SmartPort interface
# in slot 5 (PR#5 boots it).
# ProDOS data volumes are made with tools/buildDiskImage.py --os apple2
# (800K by default; --bootable makes a ProDOS boot disk). Upload the
# result to /retro/images/apple2/ on the SD card with "File Transfer".
# Example only; uncomment after uploading the 800K data image (PR6.2 is
# /DATA in ProDOS; use CATALOG,S6,D2 or CAT /DATA):
#
# PR6.2=/retro/images/apple2/data800.po,RW,APPLE2_800K
#
PR6.1=/littlefs/apple2/system.dsk,RO,APPLE2_140K
#
# Non-system images can be written back to their image files.
PR5.1=/retro/images/apple2/data2.dsk,RW,APPLE2_140K
PR5.2=/retro/images/apple2/pascal640.po,RW,APPLE2_640K