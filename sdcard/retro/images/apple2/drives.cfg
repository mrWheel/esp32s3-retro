# Apple II drives: PR<slot>.<drive>=<image>,RO,<profile>
#   slot    4..7  (Disk II controller card; its boot ROM is at $Cn00, I/O at $C080+n*16)
#   drive   1..2
#   mode    RO only (the Apple II drives are read-only)
#   profile APPLE2_140K (143360 bytes, 35 tracks) or APPLE2_640K (655360 bytes, 160 tracks = 1280 Pascal blocks)
#   image   below /littlefs/apple2/ or /retro/images/apple2/
# The sector order comes from the extension (.po = ProDOS/Pascal, .do = DOS) or else from the content.
# PR6.1 defaults to /littlefs/apple2/system.dsk when it is not listed.
#
#PR6.2=/retro/images/apple2/data2.dsk,RW,APPLE2_640K
#PR5.1=/retro/images/apple2/data.dsk,RO,APPLE2_140K
